<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    
    <clipPath id="iconShape">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"></rect>
    </clipPath>

    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090A14"></stop>
      <stop offset="100%" style="stop-color:#0F1020"></stop>
    </linearGradient>

    
    <radialGradient id="bloom" cx="50%" cy="50%" r="42%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.14"></stop>
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0"></stop>
    </radialGradient>

    
    <filter id="squareGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    
    <filter id="sGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"></feGaussianBlur>
      <feColorMatrix in="blur" type="matrix" values="0.30 0    0    0 0&#xA;                0    0.31 0    0 0&#xA;                0    0    1.05 0 0&#xA;                0    0    0    0.95 0" result="violetBloom"></feColorMatrix>
      <feGaussianBlur in="violetBloom" stdDeviation="6" result="blurInner"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="violetBloom"></feMergeNode>
        <feMergeNode in="blurInner"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#iconShape)">

    
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"></rect>
    <rect x="0" y="0" width="512" height="512" fill="url(#bloom)"></rect>

    
    
    <g stroke="#6366F1" stroke-width="0.7" opacity="0.10">
      
      <line x1="0" y1="56" x2="512" y2="56"></line>
      <line x1="0" y1="112" x2="512" y2="112"></line>
      <line x1="0" y1="168" x2="512" y2="168"></line>
      <line x1="0" y1="224" x2="512" y2="224"></line>
      <line x1="0" y1="280" x2="512" y2="280"></line>
      <line x1="0" y1="336" x2="512" y2="336"></line>
      <line x1="0" y1="392" x2="512" y2="392"></line>
      <line x1="0" y1="448" x2="512" y2="448"></line>
      
      <line x1="56" y1="0" x2="56" y2="512"></line>
      <line x1="112" y1="0" x2="112" y2="512"></line>
      <line x1="168" y1="0" x2="168" y2="512"></line>
      <line x1="224" y1="0" x2="224" y2="512"></line>
      <line x1="280" y1="0" x2="280" y2="512"></line>
      <line x1="336" y1="0" x2="336" y2="512"></line>
      <line x1="392" y1="0" x2="392" y2="512"></line>
      <line x1="448" y1="0" x2="448" y2="512"></line>
    </g>

    
    
    

    
    <rect x="52" y="49" width="8" height="8" rx="1.5" fill="#6366F1" opacity="0.45" filter="url(#squareGlow)"></rect>
    <rect x="358" y="94" width="6" height="6" rx="1" fill="#818CF8" opacity="0.35"></rect>
    <rect x="446" y="47" width="9" height="9" rx="1.5" fill="#6366F1" opacity="0.40" filter="url(#squareGlow)"></rect>
    <rect x="108" y="108" width="7" height="7" rx="1.5" fill="#6366F1" opacity="0.30"></rect>

    
    <rect x="450" y="168" width="8" height="8" rx="1.5" fill="#818CF8" opacity="0.38" filter="url(#squareGlow)"></rect>
    <rect x="392" y="280" width="6" height="6" rx="1" fill="#6366F1" opacity="0.28"></rect>
    <rect x="460" y="335" width="9" height="9" rx="1.5" fill="#6366F1" opacity="0.42" filter="url(#squareGlow)"></rect>
    <rect x="390" y="450" width="7" height="7" rx="1.5" fill="#818CF8" opacity="0.32"></rect>

    
    <rect x="275" y="454" width="8" height="8" rx="1.5" fill="#6366F1" opacity="0.38" filter="url(#squareGlow)"></rect>
    <rect x="108" y="446" width="6" height="6" rx="1" fill="#6366F1" opacity="0.30"></rect>
    <rect x="52" y="396" width="9" height="9" rx="1.5" fill="#818CF8" opacity="0.40" filter="url(#squareGlow)"></rect>

    
    <rect x="48" y="168" width="7" height="7" rx="1.5" fill="#6366F1" opacity="0.35"></rect>
    <rect x="56" y="280" width="8" height="8" rx="1.5" fill="#818CF8" opacity="0.40" filter="url(#squareGlow)"></rect>
    <rect x="110" y="335" width="6" height="6" rx="1" fill="#6366F1" opacity="0.28"></rect>

    
    <rect x="168" y="112" width="5" height="5" rx="1" fill="#6366F1" opacity="0.22"></rect>
    <rect x="340" y="168" width="5" height="5" rx="1" fill="#6366F1" opacity="0.20"></rect>
    <rect x="168" y="400" width="5" height="5" rx="1" fill="#818CF8" opacity="0.22"></rect>
    <rect x="340" y="390" width="6" height="6" rx="1" fill="#6366F1" opacity="0.20"></rect>

    
    
    <text x="258" y="338" font-family="&#39;Helvetica Neue&#39;, &#39;Arial Black&#39;, Arial, sans-serif" font-size="282" font-weight="900" text-anchor="middle" fill="#4F46E5" opacity="0.60" transform="translate(3,5)">S</text>
    
    <text x="256" y="336" font-family="&#39;Helvetica Neue&#39;, &#39;Arial Black&#39;, Arial, sans-serif" font-size="282" font-weight="900" text-anchor="middle" fill="#FFFFFF" filter="url(#sGlow)">S</text>

  </g>
</svg>