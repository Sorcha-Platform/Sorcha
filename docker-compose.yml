# Sorcha service topology — spec 117 FR-034 (T093)
#   gateway          :80    YARP API gateway, /.well-known/* + Scalar /openapi
#   blueprint        :5000  Workflow management, SignalR notifications
#   wallet           (int)  Crypto operations, HD wallets (BIP32/39/44)
#   register         :5380  Distributed ledger, OData query surface
#   tenant           :5450  Multi-tenant auth, JWT issuer, Participant Identity
#   peer             :5002  P2P network, gRPC inter-peer transport
#   validator        (int)  Consensus, chain integrity
#   mcp-server       (int)  MCP tool surface (36 tools across 3 categories)
#   postgres         :5432  Relational store (per-service databases)
#   mongodb          :27017 Document store (Register transactions)
#   redis            :6379  Cache + SignalR backplane
#   aspire-dashboard :18888 OpenTelemetry visualisation UI
# Public entry: http://localhost (gateway) — every other port is internal-only.
# UI mounts:    http://localhost/app (Sorcha.UI), /wallet, /verify.
# Verify install: curl -s http://localhost/api/health

# OpenTelemetry configuration for sending traces/metrics to Aspire Dashboard
# The OTLP endpoint points to the aspire-dashboard container's gRPC port
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sorcha-service}
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=docker

# Shared JWT configuration for all services
# Installation name is used to derive issuer and audience automatically
# The tenant service is the JWT authority - it issues tokens with the installation name
# All other services validate tokens against this same installation name
# The signing key is loaded from .env file or generated automatically
# For production: Replace with Azure Key Vault or other secure key management
x-jwt-env: &jwt-env
  JwtSettings__InstallationName: ${INSTALLATION_NAME:-localhost}
  JwtSettings__SigningKey: ${JWT_SIGNING_KEY:-c29yY2hhLWRvY2tlci1kZXYta2V5LTIwMjUtbWluLTI1Ni1iaXRzLXNlY3VyZQ==}

# Platform-default connection strings, resolved by the SorchaConnections cascade
# in Sorcha.ServiceDefaults: ConnectionStrings:{Service}:{Kind} falls back to
# ConnectionStrings:Sorcha:{Kind}. Per-service overrides go in that service's
# environment block alongside this anchor (e.g. ConnectionStrings__Tenant__Postgres
# would point Tenant at a different cluster). Postgres carries credentials/host
# only; the per-service code appends Database={dbName} (e.g. sorcha_tenant) at
# resolve time. Mongo and Redis don't carry a database/db-index in-band.
#
# The Aspire-named aliases (ConnectionStrings__redis, ConnectionStrings__mongodb)
# are deduped via YAML scalar anchors. They exist so services that still use
# Aspire's builder.AddRedisClient("redis") or GetConnectionString("mongodb")
# continue to work without code change. Future PR can replace those Aspire-style
# lookups with cascade-aware registrations and drop the aliases.
x-sorcha-connections: &sorcha-connections
  ConnectionStrings__Sorcha__Postgres: Host=postgres;Username=sorcha;Password=sorcha_dev_password
  ConnectionStrings__Sorcha__Mongo: &sorcha-mongo mongodb://sorcha:sorcha_dev_password@mongodb:27017
  ConnectionStrings__Sorcha__Redis: &sorcha-redis redis:6379
  # TODO(db-audit): drop these two Aspire-named aliases once every service that
  # uses builder.AddRedisClient("redis") / GetConnectionString("mongodb") has
  # been migrated to a cascade-aware registration that reads :Sorcha:Redis /
  # :Sorcha:Mongo directly. Today they're needed for back-compat with the Aspire
  # client extensions in Wallet/Blueprint/Peer/Register/Validator/Haip Program.cs.
  ConnectionStrings__mongodb: *sorcha-mongo
  ConnectionStrings__redis: *sorcha-redis

# Container hardening profile applied to every Sorcha .NET service.
# - read_only:true     → root filesystem is immutable; named volumes (DataProtection-Keys,
#                        wallet-keys) and tmpfs mounts remain writable.
# - cap_drop:[ALL]     → drops every Linux capability. Chiseled .NET images need none —
#                        they bind to >1024 ports as a non-root user and never call
#                        privileged syscalls.
# - no-new-privileges  → blocks setuid binaries from gaining capabilities at exec time.
#                        Belt-and-braces with cap_drop:ALL.
# - pids_limit         → stops a runaway service from fork-bombing the host.
# - tmpfs /tmp         → ASP.NET / .NET runtime needs /tmp for HTTP request bodies,
#                        Razor pre-compile caches, etc. Sized to 64m (well above
#                        observed steady-state usage; bump per-service if needed).
x-app-hardening: &app-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 200
  tmpfs:
    - /tmp:rw,size=64m,mode=1777

# Lighter hardening profile for stateful infrastructure (postgres / mongo / redis).
# These images run init scripts as root and chown data directories, so cap_drop:ALL
# and read_only break them. no-new-privileges is the one universally safe knob.
x-infra-hardening: &infra-hardening
  security_opt:
    - no-new-privileges:true

services:
  # ===========================
  # Infrastructure Services
  # ===========================

  redis:
    image: redis:8-alpine
    container_name: sorcha-redis
    restart: unless-stopped
    <<: *infra-hardening
    mem_limit: 512m
    pids_limit: 100
    # maxmemory caps Redis below the container budget so it can't OOM-kill
    # itself; volatile-lru evicts only TTL-bearing keys when full so the
    # event streams (sorcha:events:*, no TTL) and the few persistent state
    # keys (token-revocation, idempotency anchors) never get dropped.
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "volatile-lru", "--save", "3600", "1", "300", "100", "60", "10000"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - sorcha-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: sorcha-postgres
    restart: unless-stopped
    <<: *infra-hardening
    mem_limit: 1g
    pids_limit: 200
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: sorcha
      POSTGRES_PASSWORD: sorcha_dev_password
      POSTGRES_DB: sorcha
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - sorcha-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorcha"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  mongodb:
    image: mongo:8
    container_name: sorcha-mongodb
    restart: unless-stopped
    <<: *infra-hardening
    mem_limit: 1g
    pids_limit: 200
    # WiredTiger cache defaults to 50% of HOST RAM, which inside a 1 GB
    # container would be ~30 GB and gets the kernel to OOM-kill mongod
    # the moment the working set grows. Cap at 0.5 GB and leave the rest
    # of the container budget for connections + ingest.
    command: ["mongod", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: sorcha
      MONGO_INITDB_ROOT_PASSWORD: sorcha_dev_password
    volumes:
      - mongodb-data:/data/db
    networks:
      - sorcha-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ===========================
  # Observability Services
  # ===========================

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: sorcha-aspire-dashboard
    restart: unless-stopped
    # aspire-dashboard is a Microsoft-shipped image that we don't control. Apply the
    # safe lighter profile rather than the full app-hardening anchor — the dashboard
    # writes telemetry working files to its own paths and we'd rather not chase
    # tmpfs sizing for a dev-time dashboard.
    <<: *infra-hardening
    mem_limit: 1g
    pids_limit: 200
    ports:
      - "${ASPIRE_UI_PORT:-18888}:18888"    # Dashboard UI
      - "${OTLP_GRPC_PORT:-4317}:18889"     # OTLP gRPC endpoint
      - "${OTLP_HTTP_PORT:-4318}:18890"     # OTLP HTTP endpoint
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
      - DASHBOARD__OTLP__AUTHMODE=Unsecured
    networks:
      - sorcha-network

  # ===========================
  # Application Services
  # ===========================

  blueprint-service:
    build:
      context: .
      dockerfile: src/Services/Sorcha.Blueprint.Service/Dockerfile
    image: sorchadev/blueprint-service:latest
    container_name: sorcha-blueprint-service
    restart: unless-stopped
    <<: *app-hardening
    mem_limit: 1g
    ports:
      - "${BLUEPRINT_PORT:-5000}:8080"
    environment:
      # Postgres + Mongo + Redis come from the *sorcha-connections anchor.
      # Blueprint Postgres resolves to sorcha_blueprint via the cascade
      # (resolver appends Database=sorcha_blueprint).
      <<: [*otel-env, *jwt-env, *sorcha-connections]
      OTEL_SERVICE_NAME: blueprint-service
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # AI Provider configuration (Anthropic Claude API)
      AIProvider__ApiKey: ${ANTHROPIC_API_KEY:-}
      AIProvider__Model: claude-sonnet-4-5-20250929
      # Service client configuration for inter-service communication
      ServiceClients__RegisterService__Address: http://register-service:8080
      ServiceClients__WalletService__Address: http://wallet-service:8080
      ServiceClients__ValidatorService__Address: http://validator-service:8080
      ServiceClients__TenantService__Address: http://tenant-service:8080
      ServiceClients__HaipService__Address: http://haip-service:8080
      # Feature 137 (C4): Peer Service client config so F108 submission fan-out
      # (ActionExecutionService -> IPeerServiceClient.DistributeTransactionAsync) reaches the
      # peer service. The distribute REST call uses HttpAddress (HTTP/8080); Address is the
      # gRPC port (5000). Without HttpAddress the HttpClient BaseAddress is unset and fan-out
      # fails with "BaseAddress must be set".
      ServiceClients__PeerService__Address: http://peer-service:5000
      ServiceClients__PeerService__HttpAddress: http://peer-service:8080
      # Service-to-service auth for Wallet/Register Service calls during action execution
      ServiceAuth__ClientId: service-blueprint
      # Per-deploy secret (issue #1412) — sorcha-setup.sh generates BLUEPRINT_SERVICE_SECRET
      # into .env. No literal default: a bare `docker compose up` without a generated
      # .env must fail loudly, not silently run with a committed secret.
      ServiceAuth__ClientSecret: ${BLUEPRINT_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      # F191 (#1420): workload-certificate credential — base64 PKCS#12 delivered via .env by
      # `sorcha workload-ca` (invoked from sorcha-setup.sh). Empty default keeps the legacy
      # secret path; when set, token minting goes over mTLS and no secret is transmitted.
      ServiceAuth__ClientCertificate: ${BLUEPRINT_WORKLOAD_CERT:-}
      ServiceAuth__ClientCertificatePassword: ${WORKLOAD_CERT_PASSWORD:-}
      ServiceAuth__TrustBundle: ${WORKLOAD_TRUST_BUNDLE:-}
      ServiceAuth__Scopes: "wallets:sign registers:write blueprints:manage"
      # Transaction confirmation tuning for Docker dev
      TransactionConfirmation__TimeoutSeconds: "60"
      TransactionConfirmation__PollIntervalSeconds: "1"
      # Feature 111: Timebound Presentation Lifecycle
      PresentationLifecycle__DefaultValidityWindowSeconds: "600"
      PresentationLifecycle__SweeperIntervalSeconds: "30"
      PresentationLifecycle__SweeperLeaderLockTtlSeconds: "60"
      PresentationLifecycle__RateLimit__Threshold: "10"
      PresentationLifecycle__RateLimit__WindowSeconds: "600"
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
      register-service:
        condition: service_healthy
      validator-service:
        condition: service_healthy
      haip-service:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - sorcha-network
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wallet-service:
    build:
      context: .
      dockerfile: src/Services/Sorcha.Wallet.Service/Dockerfile
    image: sorchadev/wallet-service:latest
    container_name: sorcha-wallet-service
    restart: unless-stopped
    <<: *app-hardening
    mem_limit: 1g
    # No ports published - internal service only, accessed via API Gateway
    environment:
      # Postgres + Redis come from the *sorcha-connections anchor.
      # Wallet's Timeout / Command Timeout (30s each) are appended in
      # WalletServiceExtensions.cs after the resolver returns the base string.
      <<: [*otel-env, *jwt-env, *sorcha-connections]
      OTEL_SERVICE_NAME: wallet-service
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ServiceAuth__ClientId: service-wallet
      # Per-deploy secret (issue #1412) — sorcha-setup.sh generates WALLET_SERVICE_SECRET
      # into .env. No literal default: a bare `docker compose up` without a generated
      # .env must fail loudly, not silently run with a committed secret.
      ServiceAuth__ClientSecret: ${WALLET_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      # F191 (#1420): workload-certificate credential (see blueprint-service note).
      ServiceAuth__ClientCertificate: ${WALLET_WORKLOAD_CERT:-}
      ServiceAuth__ClientCertificatePassword: ${WORKLOAD_CERT_PASSWORD:-}
      ServiceAuth__TrustBundle: ${WORKLOAD_TRUST_BUNDLE:-}
      ServiceAuth__Scopes: "registers:write registers:read"
      ServiceClients__TenantService__Address: http://tenant-service:8080
      ServiceClients__RegisterService__Address: http://register-service:8080
      # Explicit gRPC address for IRegisterAddressClient (Feature 106 bloom hook fan-out).
      # Port 5001 is the dedicated HTTP/2 gRPC endpoint; port 8080 is HTTP/1.1 REST only.
      # h2c cleartext can't multiplex with HTTP/1.1 on a single Kestrel port because it
      # requires ALPN which requires TLS.
      ServiceClients__RegisterService__GrpcAddress: http://register-service:5001
      ServiceClients__BlueprintService__Address: http://blueprint-service:8080
      # Dev-mode AES-256 key (32 bytes base64). The previous placeholder decoded to
      # 27 bytes, which OrgKeyProtectionProvider's strict validator rejects. The key
      # only matters when OrgKeyDerivationService actually fires (Feature 083 derived
      # keys + Feature 120 issuance-key lazy derivation). Production deployments
      # override this via secret.
      OrgKeyProtection__EncryptionKey: "OVL5NaJzR/Hpy2H5YgjYBX51Sws+q8oQXDG234SYnQw="
      # Encryption Provider Configuration
      # LinuxSecretService with fallback to file-based key storage (Docker doesn't have D-Bus)
      EncryptionProvider__Type: LinuxSecretService
      EncryptionProvider__DefaultKeyId: wallet-master-key-2025
      EncryptionProvider__LinuxSecretService__ServiceName: sorcha-wallet-service
      EncryptionProvider__LinuxSecretService__FallbackKeyStorePath: /var/lib/sorcha/wallet-keys
      # Stable key material prevents KEK changes when /etc/machine-id is regenerated on container rebuild
      EncryptionProvider__LinuxSecretService__MachineKeyMaterial: sorcha-docker-wallet-stable-key-v1
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
      - wallet-encryption-keys:/var/lib/sorcha/wallet-keys
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - sorcha-network
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  register-service:
    build:
      context: .
      dockerfile: src/Services/Sorcha.Register.Service/Dockerfile
    image: sorchadev/register-service:latest
    container_name: sorcha-register-service
    restart: unless-stopped
    <<: *app-hardening
    mem_limit: 1g
    ports:
      - "${REGISTER_PORT:-5380}:8080"  # Exposed for walkthrough testing
    environment:
      # *sorcha-connections supplies ConnectionStrings__Sorcha__{Postgres,Mongo,Redis}
      # used by the Feature 118 SignalR backplane (AddSorchaHub) via the SorchaConnections
      # cascade. The legacy ConnectionStrings__Redis below stays for the Aspire-named
      # alias used by other code paths in Register Service.
      <<: [*otel-env, *jwt-env, *sorcha-connections]
      OTEL_SERVICE_NAME: register-service
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__MongoDB: mongodb://sorcha:sorcha_dev_password@mongodb:27017
      # Configure MongoDB storage with per-register databases (production-ready persistence)
      RegisterStorage__Type: MongoDB
      RegisterStorage__MongoDB__ConnectionString: mongodb://sorcha:sorcha_dev_password@mongodb:27017
      RegisterStorage__MongoDB__DatabaseName: sorcha_register_registry
      RegisterStorage__MongoDB__DatabaseNamePrefix: sorcha_register_
      RegisterStorage__MongoDB__UseDatabasePerRegister: "true"
      RegisterStorage__MongoDB__RegisterCollectionName: registers
      RegisterStorage__MongoDB__TransactionCollectionName: transactions
      RegisterStorage__MongoDB__DocketCollectionName: dockets
      RegisterStorage__MongoDB__CreateIndexesOnStartup: "true"
      ServiceClients__WalletService__Address: http://sorcha-wallet-service:8080
      ServiceClients__WalletService__UseGrpc: "false"
      # Explicit gRPC addresses (Feature 106). Port 5001 is HTTP/2-only for gRPC;
      # port 8080 is HTTP/1.1 REST only. h2c cleartext can't share a Kestrel port
      # with HTTP/1.1 without TLS/ALPN, so services bind two ports. The "https+http://"
      # default from service-discovery isn't registered in this topology and would
      # throw "No address resolver configured for the scheme 'https+http'" anyway.
      ServiceClients__WalletService__GrpcAddress: http://sorcha-wallet-service:5001
      ServiceClients__ValidatorService__Address: http://sorcha-validator-service:8080
      ServiceClients__ValidatorService__UseGrpc: "false"
      ServiceClients__PeerService__Address: http://sorcha-peer-service:5000
      ServiceClients__PeerService__HttpAddress: http://sorcha-peer-service:8080
      ServiceClients__PeerService__GrpcAddress: http://sorcha-peer-service:5000
      # System wallet signing (for blueprint publish, governance Control TXs).
      # MUST match Validator__ValidatorId on validator-service — see note on that
      # setting below. Both services hit Wallet.Service's CreateOrRetrieveSystemWallet
      # with this identifier; when Register.Service builds a new register's validator
      # roster (Feature 108), it derives the docket-signing key under the SAME wallet
      # that Validator.Service will later sign dockets with. Divergent values leave
      # every locally-created register with a roster the validator doesn't match,
      # so docket sealing never starts.
      SystemWalletSigning__ValidatorId: local-validator
      # Service-to-service auth for Wallet Service calls
      ServiceAuth__ClientId: register-service
      # Per-deploy secret (issue #1412) — sorcha-setup.sh generates REGISTER_SERVICE_SECRET
      # into .env. No literal default: a bare `docker compose up` without a generated
      # .env must fail loudly, not silently run with a committed secret.
      ServiceAuth__ClientSecret: ${REGISTER_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      # F191 (#1420): workload-certificate credential (see blueprint-service note).
      ServiceAuth__ClientCertificate: ${REGISTER_WORKLOAD_CERT:-}
      ServiceAuth__ClientCertificatePassword: ${WORKLOAD_CERT_PASSWORD:-}
      ServiceAuth__TrustBundle: ${WORKLOAD_TRUST_BUNDLE:-}
      ServiceAuth__Scopes: "wallets:sign validator:write"
      ServiceClients__TenantService__Address: http://tenant-service:8080
      # System Register bootstrap is automatic (Feature 057) — no env var needed
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - sorcha-network
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tenant-service:
    build:
      context: .
      dockerfile: src/Services/Sorcha.Tenant.Service/Dockerfile
    image: sorchadev/tenant-service:latest
    container_name: sorcha-tenant-service
    restart: unless-stopped
    <<: *app-hardening
    mem_limit: 1g
    ports:
      - "${TENANT_PORT:-5450}:8080"  # Exposed for direct access during development/bootstrap
    environment:
      # Tenant is the SorchaConnections-cascade pilot. Postgres + Redis come from the
      # *sorcha-connections anchor (default for the platform); the resolver in
      # Sorcha.ServiceDefaults appends Database=sorcha_tenant. Add a
      # ConnectionStrings__Tenant__Postgres / __Redis line here if Tenant should ever
      # diverge from the platform default.
      <<: [*otel-env, *jwt-env, *sorcha-connections]
      OTEL_SERVICE_NAME: tenant-service
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Tenant service is the JWT authority - it issues tokens using the installation name
      JwtSettings__SigningKeySource: Configuration
      # Dev/demo: allow a SystemAdmin to provision pre-verified org-scoped users (bypasses the
      # email-verification loop). OFF by default in code; enabled here for local dev + walkthroughs.
      # MUST stay false/unset in production. See OrgProvisioningService (spec 136 follow-up).
      Platform__AllowAdminVerifiedUserCreation: "true"
      # Service-to-service auth for Wallet Service calls during wallet link verification
      ServiceAuth__ClientId: tenant-service
      # Per-deploy secret (issue #1412) — sorcha-setup.sh generates TENANT_SERVICE_SECRET
      # into .env. No literal default: a bare `docker compose up` without a generated
      # .env must fail loudly, not silently run with a committed secret.
      ServiceAuth__ClientSecret: ${TENANT_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      # F191 (#1420): workload-certificate credential (see blueprint-service note).
      ServiceAuth__ClientCertificate: ${TENANT_WORKLOAD_CERT:-}
      ServiceAuth__ClientCertificatePassword: ${WORKLOAD_CERT_PASSWORD:-}
      ServiceAuth__TrustBundle: ${WORKLOAD_TRUST_BUNDLE:-}
      # F191: workload mTLS listener (certificate-credential mint). Activates only when BOTH
      # values are set; :8443 stays internal to the compose network (no host publish).
      ServiceAuth__Mtls__ServerCertificate: ${TENANT_WORKLOAD_SERVER_CERT:-}
      ServiceAuth__Mtls__ServerCertificatePassword: ${WORKLOAD_CERT_PASSWORD:-}
      ServiceAuth__Mtls__TrustBundle: ${WORKLOAD_TRUST_BUNDLE:-}
      # persona:crypto is required by the Wallet Service persona encrypt/decrypt
      # endpoints that back the Consumer persona feature (092). wallets:sign and
      # wallets:verify are retained for participant wallet link verification.
      ServiceAuth__Scopes: "wallets:sign wallets:verify persona:crypto"
      # Per-deploy service-principal seed secrets (issue #1412) — read by
      # DatabaseInitializer.SeedServicePrincipalsAsync as Seed:ServicePrincipals:{ClientId}.
      # Keyed by each principal's ACTUAL ClientId (see DatabaseInitializer.cs), NOT the
      # service's own ServiceAuth__ClientId env var name. Same generated value as the
      # matching client-side ServiceAuth__ClientSecret above so client and server agree.
      # No literal defaults: a bare `docker compose up` without a generated .env
      # must fail loudly, not silently run with a committed secret.
      Seed__ServicePrincipals__service-blueprint: ${BLUEPRINT_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      Seed__ServicePrincipals__service-wallet: ${WALLET_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      Seed__ServicePrincipals__register-service: ${REGISTER_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      Seed__ServicePrincipals__service-peer: ${PEER_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      Seed__ServicePrincipals__validator-service: ${VALIDATOR_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      Seed__ServicePrincipals__tenant-service: ${TENANT_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      Seed__ServicePrincipals__service-haip: ${HAIP_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      Seed__ServicePrincipals__service-verifier: ${VERIFIER_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      # Seed admin credentials (issues #1409 / #1434). An empty AdminPassword is
      # allowed in Development (DatabaseInitializer uses its dev default); in
      # Production/Staging DatabaseInitializer fail-closes at startup unless it is
      # set, so sorcha-setup.sh generates one for any non-Development install.
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@sorcha.local}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      ServiceClients__WalletService__Address: http://wallet-service:8080
      ServiceClients__TenantService__Address: http://tenant-service:8080
      ServiceClients__RegisterService__Address: http://register-service:8080
      ServiceClients__ValidatorService__Address: http://validator-service:8080
      # Relaxed lockout thresholds for development/testing (production defaults: 5/10/15/20/25)
      Security__Lockout__Tier1Threshold: "50"
      Security__Lockout__Tier1Duration: "00:01:00"
      Security__Lockout__Tier2Threshold: "100"
      Security__Lockout__Tier2Duration: "00:05:00"
      Security__Lockout__PermanentLockThreshold: "1000"
      # Azure Communication Services email (sorcha.dev domain, DKIM+SPF verified)
      Email__AcsConnectionString: ${ACS_EMAIL_CONNECTION_STRING:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-noreply@sorcha.dev}
      Email__FromName: ${EMAIL_FROM_NAME:-Sorcha Platform}
      Email__BaseUrl: ${EMAIL_BASE_URL:-http://localhost}
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - sorcha-network
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Peer Service (standalone node for local development)
  peer-service:
    build:
      context: .
      dockerfile: src/Services/Sorcha.Peer.Service/Dockerfile
    image: sorchadev/peer-service:latest
    container_name: sorcha-peer-service
    restart: unless-stopped
    <<: *app-hardening
    mem_limit: 1g
    ports:
      - "${PEER_GRPC_PORT:-50051}:5000"  # gRPC for external P2P connections
    environment:
      # Postgres + Mongo + Redis come from the *sorcha-connections anchor.
      # Peer Postgres resolves to sorcha_peer via the cascade. Mongo lookup
      # in PeerService Program.cs reads via the cascade resolver too; the
      # MongoDB__DatabaseName below is the per-service database NAME (not a
      # connection string) selected via IMongoClient.GetDatabase(name).
      <<: [*otel-env, *jwt-env, *sorcha-connections]
      OTEL_SERVICE_NAME: peer-service
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HTTP_PORTS: "8080"
      MongoDB__DatabaseName: sorcha_system_register
      ServiceAuth__ClientId: service-peer
      # Per-deploy secret (issue #1412) — sorcha-setup.sh generates PEER_SERVICE_SECRET
      # into .env. No literal default: a bare `docker compose up` without a generated
      # .env must fail loudly, not silently run with a committed secret.
      ServiceAuth__ClientSecret: ${PEER_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      # F191 (#1420): workload-certificate credential (see blueprint-service note).
      ServiceAuth__ClientCertificate: ${PEER_WORKLOAD_CERT:-}
      ServiceAuth__ClientCertificatePassword: ${WORKLOAD_CERT_PASSWORD:-}
      ServiceAuth__TrustBundle: ${WORKLOAD_TRUST_BUNDLE:-}
      ServiceAuth__Scopes: "registers:write registers:read"
      ServiceClients__TenantService__Address: http://tenant-service:8080
      ServiceClients__RegisterService__Address: http://register-service:8080
      # Feature 108: the peer-service is the cross-node fan-out RECEIVER — when it accepts a
      # forwarded submission for a register this node owns, it submits it to the local validator
      # for sealing. Without this address the forward is rejected ("Validator Service address not
      # configured") and the cross-node write hop never seals on the owner.
      ServiceClients__ValidatorService__Address: http://validator-service:8080
      # Node identity and network configuration
      PeerService__NodeId: "${PEER_NODE_ID:-local-peer.sorcha.dev}"
      # PEER_PUBLIC_ADDRESS sets the node's externally-dialable address. It must bind to
      # NetworkAddress.ExternalAddress — PublicAddress was a dead config key (no such property),
      # so the value was silently ignored and the node never became rendezvous-capable. (#909)
      PeerService__NetworkAddress__ExternalAddress: "${PEER_PUBLIC_ADDRESS:-}"
      PeerService__Port: "5000"
      PeerService__EnableTls: "false"
      # Cross-machine seed node (configure via .env). The legacy n0.sorcha.dev
      # PeerRouter has been retired — peers self-introduce via RegisterPeer at
      # bootstrap so any reachable seed is sufficient.
      PeerService__SeedNodes__SeedNodes__0__NodeId: "${SEED_PEER_NODE_ID:-}"
      PeerService__SeedNodes__SeedNodes__0__Hostname: "${SEED_PEER_HOST:-}"
      PeerService__SeedNodes__SeedNodes__0__Port: "${SEED_PEER_PORT:-50051}"
      PeerService__SeedNodes__SeedNodes__0__EnableTls: "${SEED_PEER_ENABLE_TLS:-false}"
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - sorcha-network
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  validator-service:
    build:
      context: .
      dockerfile: src/Services/Sorcha.Validator.Service/Dockerfile
    image: sorchadev/validator-service:latest
    container_name: sorcha-validator-service
    restart: unless-stopped
    <<: *app-hardening
    mem_limit: 1g
    ports:
      - "${VALIDATOR_HTTP_PORT:-5800}:8080"   # HTTP REST API and health checks
      - "${VALIDATOR_GRPC_PORT:-5801}:8081"   # gRPC endpoint
    environment:
      # *sorcha-connections supplies ConnectionStrings__Sorcha__{Postgres,Mongo,Redis}
      # for the cascade-aware resolver in VerifiedQueueExtensions / IRegisterRepository
      # extensions. ConnectionStrings__Redis below stays for the Aspire-named
      # AddRedisClient("redis") path until that's migrated. Required for
      # IVerifiedTransactionQueue → RedisVerifiedTransactionQueue under Staging
      # (Feature 113 storage audit / issue #498).
      <<: [*otel-env, *jwt-env, *sorcha-connections]
      OTEL_SERVICE_NAME: validator-service
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Redis: redis:6379
      # Service-to-service auth for Wallet Service calls
      ServiceAuth__ClientId: validator-service
      # Per-deploy secret (issue #1412) — sorcha-setup.sh generates VALIDATOR_SERVICE_SECRET
      # into .env. No literal default: a bare `docker compose up` without a generated
      # .env must fail loudly, not silently run with a committed secret.
      ServiceAuth__ClientSecret: ${VALIDATOR_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      # F191 (#1420): workload-certificate credential (see blueprint-service note).
      ServiceAuth__ClientCertificate: ${VALIDATOR_WORKLOAD_CERT:-}
      ServiceAuth__ClientCertificatePassword: ${WORKLOAD_CERT_PASSWORD:-}
      ServiceAuth__TrustBundle: ${WORKLOAD_TRUST_BUNDLE:-}
      ServiceAuth__Scopes: "registers:write registers:read blueprints:read"
      # Validator configuration.
      # Shared identifier for this node's local-validator system wallet.
      # MUST match register-service's SystemWalletSigning__ValidatorId — see note
      # there. Feature 108: the validator's docket-signing key (derived under this
      # wallet via "sorcha:docket-signing") is what Register.Service puts on a
      # new register's roster, so both services must derive under the same wallet.
      Validator__ValidatorId: local-validator
      # SystemWalletAddress left empty - wallet created automatically on startup
      Validator__SystemWalletAddress: ""
      # Service client configuration for inter-service communication
      ServiceClients__BlueprintService__Address: http://blueprint-service:8080
      ServiceClients__WalletService__Address: http://wallet-service:8080
      ServiceClients__TenantService__Address: http://tenant-service:8080
      ServiceClients__RegisterService__Address: http://sorcha-register-service:8080
      ServiceClients__PeerService__Address: http://peer-service:5000
      # Read-only access to Register Service's MongoDB (for governance roster reconstruction)
      RegisterStorage__Type: MongoDB
      RegisterStorage__MongoDB__ConnectionString: mongodb://sorcha:sorcha_dev_password@mongodb:27017
      RegisterStorage__MongoDB__DatabaseName: sorcha_register_registry
      RegisterStorage__MongoDB__DatabaseNamePrefix: sorcha_register_
      RegisterStorage__MongoDB__UseDatabasePerRegister: "true"
      RegisterStorage__MongoDB__RegisterCollectionName: registers
      RegisterStorage__MongoDB__TransactionCollectionName: transactions
      RegisterStorage__MongoDB__DocketCollectionName: dockets
      RegisterStorage__MongoDB__CreateIndexesOnStartup: "false"
      # Docket build tuning for Docker dev — fast cycles for interactive use
      DocketBuild__TimeThreshold: "00:00:03"
      DocketBuild__SizeThreshold: "5"
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - sorcha-network
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sorcha-ui-web:
    build:
      context: .
      dockerfile: src/Apps/Sorcha.UI/Sorcha.UI.Web/Dockerfile
    image: sorchadev/ui-web:latest
    container_name: sorcha-ui-web
    restart: unless-stopped
    <<: *app-hardening
    mem_limit: 1g
    ports:
      - "${UI_HTTP_PORT:-5400}:8080"   # HTTP
      - "${UI_HTTPS_PORT:-5401}:8443"  # HTTPS
    environment:
      <<: [*otel-env, *jwt-env]
      OTEL_SERVICE_NAME: ui-web
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # HTTPS disabled for Docker development - use HTTP only
      # ASPNETCORE_HTTPS_PORTS: 8443
      # ASPNETCORE_Kestrel__Certificates__Default__Password: SorchaDevCert2025!
      # ASPNETCORE_Kestrel__Certificates__Default__Path: /https/sorcha-ui-web.pfx
      # API Gateway configuration for backend API calls
      ApiGateway__BaseUrl: http://api-gateway:8080
      # Aspire service discovery (alternative)
      services__api-gateway__http__0: http://api-gateway:8080
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
      - ./docker/certs:/https:ro
    depends_on:
      - aspire-dashboard
    networks:
      - sorcha-network

  # Feature 114: Citizen wallet PWA (standalone Blazor WASM served via nginx)
  sorcha-wallet-pwa:
    build:
      context: .
      dockerfile: src/Apps/Sorcha.Wallet.Pwa/Dockerfile
    image: sorchadev/wallet-pwa:latest
    container_name: sorcha-wallet-pwa
    restart: unless-stopped
    mem_limit: 128m
    # Reachable internally via http://sorcha-wallet-pwa:8080 (gateway routes /wallet/*).
    # Optionally pin a host port for direct dev access.
    ports:
      - "${WALLET_PWA_PORT:-7400}:8080"
    networks:
      - sorcha-network
    depends_on:
      - api-gateway

  # Feature 127: Strathcarron Council sample portal — NOT part of the platform
  # deliverable. Its service definition lives in
  # samples/strathcarron-portal/docker-compose.yml as an opt-in overlay. Run
  # with both compose files together:
  #   docker compose -f docker-compose.yml \
  #                  -f samples/strathcarron-portal/docker-compose.yml up -d
  # See docs/superpowers/specs/2026-05-15-platform-consumer-boundary-design.md.

  # Feature 114: Reference verifier (Blazor Server)
  sorcha-verifier:
    build:
      context: .
      dockerfile: src/Apps/Sorcha.Verifier/Dockerfile
    image: sorchadev/verifier:latest
    container_name: sorcha-verifier
    restart: unless-stopped
    <<: *app-hardening
    mem_limit: 256m
    ports:
      - "${VERIFIER_PORT:-7401}:8080"
    environment:
      <<: [*otel-env, *jwt-env]
      OTEL_SERVICE_NAME: verifier
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ApiGateway__BaseUrl: http://api-gateway:8080
      ServiceAuth__ClientId: service-verifier
      # Per-deploy secret (issue #1412) — sorcha-setup.sh generates VERIFIER_SERVICE_SECRET
      # into .env. No literal default: a bare `docker compose up` without a generated
      # .env must fail loudly, not silently run with a committed secret.
      ServiceAuth__ClientSecret: ${VERIFIER_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      # F191 (#1420): workload-certificate credential (see blueprint-service note).
      ServiceAuth__ClientCertificate: ${VERIFIER_WORKLOAD_CERT:-}
      ServiceAuth__ClientCertificatePassword: ${WORKLOAD_CERT_PASSWORD:-}
      ServiceAuth__TrustBundle: ${WORKLOAD_TRUST_BUNDLE:-}
      ServiceAuth__Scopes: "blueprints:read"
      Verifier__HaipBaseUrl: http://haip-service:8080
      ServiceClients__TenantService__Address: http://tenant-service:8080
    networks:
      - sorcha-network
    depends_on:
      - api-gateway
      - aspire-dashboard

  haip-service:
    build:
      context: .
      dockerfile: src/Services/Sorcha.Haip.Service/Dockerfile
    image: sorchadev/haip-service:latest
    container_name: sorcha-haip-service
    restart: unless-stopped
    <<: *app-hardening
    mem_limit: 512m
    # No ports published - accessed via API Gateway
    environment:
      # *sorcha-connections supplies ConnectionStrings__Sorcha__Redis for the
      # IAtomicDistributedCache cascade — required if/when haip-service's
      # ASPNETCORE_ENVIRONMENT is flipped to Staging (Feature 113 audit / issue #498).
      <<: [*otel-env, *jwt-env, *sorcha-connections]
      OTEL_SERVICE_NAME: haip-service
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Redis: redis:6379
      Haip__IssuerUrl: http://127.0.0.1
      # Service-to-service auth — used by PresentationCallbackRelay (Feature 111)
      # to authenticate the callback into Blueprint Service. Seeded by
      # Tenant Service DatabaseInitializer as HaipServicePrincipalId.
      ServiceClients__BlueprintService__Address: http://blueprint-service:8080
      ServiceClients__TenantService__Address: http://tenant-service:8080
      ServiceAuth__ClientId: service-haip
      # Per-deploy secret (issue #1412) — sorcha-setup.sh generates HAIP_SERVICE_SECRET
      # into .env. No literal default: a bare `docker compose up` without a generated
      # .env must fail loudly, not silently run with a committed secret.
      ServiceAuth__ClientSecret: ${HAIP_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      # F191 (#1420): workload-certificate credential (see blueprint-service note).
      ServiceAuth__ClientCertificate: ${HAIP_WORKLOAD_CERT:-}
      ServiceAuth__ClientCertificatePassword: ${WORKLOAD_CERT_PASSWORD:-}
      ServiceAuth__TrustBundle: ${WORKLOAD_TRUST_BUNDLE:-}
      ServiceAuth__Scopes: "blueprints:read"
    depends_on:
      redis:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - sorcha-network
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api-gateway:
    build:
      context: .
      dockerfile: src/Services/Sorcha.ApiGateway/Dockerfile
    image: sorchadev/api-gateway:latest
    container_name: sorcha-api-gateway
    restart: unless-stopped
    <<: *app-hardening
    mem_limit: 512m
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:8080"    # HTTP ingress
      - "${GATEWAY_HTTPS_PORT:-443}:8443"  # HTTPS ingress
    environment:
      <<: [*otel-env, *jwt-env]
      OTEL_SERVICE_NAME: api-gateway
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080;https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: SorchaDev2025
      Services__Blueprint__Url: http://blueprint-service:8080
      Services__Wallet__Url: http://wallet-service:8080
      Services__Register__Url: http://register-service:8080
      Services__Tenant__Url: http://tenant-service:8080
      Services__Peer__Url: http://peer-service:8080  # Use Docker DNS
      Services__Validator__Url: http://validator-service:8080
      Services__Haip__Url: http://haip-service:8080
      Services__UI__Url: http://sorcha-ui-web:8080
      ConnectionStrings__Redis: redis:6379
      OpenApi__RequireAuth: ${OPENAPI_REQUIRE_AUTH:-true}
      Dashboard__AspireDashboardUrl: http://localhost:18888
      # Production rate limits, delivered via env vars (issue #1437). appsettings.Production.json
      # is stripped from every image by .dockerignore ("**/appsettings.*.json"), and deployments
      # (incl. n1) do not run ASPNETCORE_ENVIRONMENT=Production on the gateway — so the coded
      # RateLimitSettings defaults (ApiPermitLimit 100000, ApiQueueLimit 1000) were the effective
      # limits on the public edge, leaving the gateway ~100k API req/min/IP unthrottled. Env vars
      # are the real config channel for a deployed container and apply regardless of environment.
      # Values mirror src/Services/Sorcha.ApiGateway/appsettings.Production.json.
      # The QueueLimit=0 entries are load-bearing: a FixedWindow limiter QUEUES overflow up to
      # QueueLimit rather than rejecting, so any non-zero queue (the coded default is 1000) never
      # emits a 429 until a burst exceeds PermitLimit+QueueLimit in one window. QueueLimit=0 =
      # immediate clean 429 at the limit. Overridable per-deploy via the RATELIMIT_* vars.
      RateLimiting__ApiPermitLimit: ${RATELIMIT_API_PERMIT:-600}
      RateLimiting__ApiQueueLimit: ${RATELIMIT_API_QUEUE:-0}
      RateLimiting__AuthenticationPermitLimit: ${RATELIMIT_AUTH_PERMIT:-60}
      RateLimiting__AuthenticationQueueLimit: ${RATELIMIT_AUTH_QUEUE:-0}
      RateLimiting__StrictTokenLimit: ${RATELIMIT_STRICT_TOKENS:-60}
      RateLimiting__StrictTokensPerPeriod: ${RATELIMIT_STRICT_PER_PERIOD:-10}
      RateLimiting__StrictReplenishmentPeriodSeconds: ${RATELIMIT_STRICT_PERIOD_SECS:-1}
      RateLimiting__StrictQueueLimit: ${RATELIMIT_STRICT_QUEUE:-0}
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
      - ./docker/certs:/https:ro
    depends_on:
      blueprint-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      register-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
      peer-service:
        condition: service_healthy
      validator-service:
        condition: service_healthy
      haip-service:
        condition: service_healthy
      sorcha-ui-web:
        condition: service_started
      aspire-dashboard:
        condition: service_started
    networks:
      - sorcha-network
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================
  # Developer Tools
  # ===========================

  mcp-server:
    build:
      context: .
      dockerfile: src/Apps/Sorcha.McpServer/Dockerfile
    image: sorchadev/mcp-server:latest
    container_name: sorcha-mcp-server
    <<: *app-hardening
    mem_limit: 512m
    profiles:
      - tools  # Only starts with --profile tools or docker-compose run
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: mcp-server
      DOTNET_ENVIRONMENT: Development
      # Service client configuration for backend communication
      ServiceClients__BlueprintService__Address: http://blueprint-service:8080
      ServiceClients__WalletService__Address: http://wallet-service:8080
      ServiceClients__RegisterService__Address: http://register-service:8080
      ServiceClients__TenantService__Address: http://tenant-service:8080
      ServiceClients__ValidatorService__Address: http://validator-service:8080
      # JWT token can be provided via SORCHA_JWT_TOKEN environment variable or --jwt-token argument
      # Example: docker-compose run mcp-server --jwt-token <your-token>
    depends_on:
      - api-gateway
      - aspire-dashboard
    networks:
      - sorcha-network
    stdin_open: true  # Enable interactive stdin for MCP stdio transport
    tty: true         # Allocate a pseudo-TTY

  # MCP server, Streamable HTTP transport (spec 139 US3). Always-on remote surface:
  # the per-request Authorization bearer is validated against the installation issuer +
  # tier audiences (JWT env below) before any tool dispatches. Exposed to agents through
  # the gateway /mcp route. Backends are reached via the gateway so the platform authorizes
  # the forwarded caller token authoritatively.
  mcp-server-http:
    build:
      context: .
      dockerfile: src/Apps/Sorcha.McpServer/Dockerfile
    image: sorchadev/mcp-server:latest
    container_name: sorcha-mcp-server-http
    <<: *app-hardening
    mem_limit: 512m
    command: [ "--transport", "http" ]
    environment:
      <<: [ *otel-env, *jwt-env ]
      OTEL_SERVICE_NAME: mcp-server-http
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Backend communication flows through the gateway so the forwarded caller token is
      # authorized by the platform (not by anonymous service-to-service trust).
      ServiceClients__BlueprintService__Address: http://api-gateway:8080
      ServiceClients__WalletService__Address: http://api-gateway:8080
      ServiceClients__RegisterService__Address: http://api-gateway:8080
      ServiceClients__TenantService__Address: http://api-gateway:8080
      ServiceClients__ValidatorService__Address: http://api-gateway:8080
    depends_on:
      - api-gateway
      - aspire-dashboard
    networks:
      - sorcha-network

networks:
  # Bridge network for all services
  # All containers communicate via Docker DNS (e.g., http://wallet-service:8080)
  # External access controlled via published ports on host
  sorcha-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  mongodb-data:
  dataprotection-keys:
  # Wallet encryption keys volume - stores encrypted Data Encryption Keys (DEKs)
  # IMPORTANT: On fresh installations, this volume is created with root ownership.
  # The wallet service runs as non-root (UID 1654) and will fail to write keys.
  # To fix permissions, run one of:
  #   - ./scripts/fix-wallet-encryption-permissions.ps1 (Windows)
  #   - ./scripts/fix-wallet-encryption-permissions.sh (Linux/macOS)
  #   - docker run --rm -v sorcha_wallet-encryption-keys:/data alpine chown -R 1654:1654 /data
  wallet-encryption-keys:
