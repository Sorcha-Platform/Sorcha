<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorcha Peer Router - Debug Console</title>
    <link rel="icon" type="image/svg+xml" href="sorcha-icon.svg">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" href="sorcha.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Consolas, monospace;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }

        header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 18px;
            color: #58a6ff;
            font-weight: 600;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-connected { background: #238636; color: #fff; }
        .status-disconnected { background: #da3633; color: #fff; }
        .status-connecting { background: #d29922; color: #fff; }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 16px 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
            font-size: 14px;
            font-weight: 600;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            padding: 0;
            max-height: 500px;
            overflow-y: auto;
        }

        .health-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px;
        }

        .health-card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }

        .health-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #58a6ff;
        }

        .health-card .label {
            font-size: 11px;
            color: #8b949e;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .full-width { grid-column: 1 / -1; }

        .tab-bar {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #30363d;
            background: #0d1117;
        }

        .tab-btn {
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            color: #8b949e;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }

        .tab-btn:hover { color: #c9d1d9; }
        .tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; }

        .tab-btn .tab-badge {
            font-size: 11px;
            color: #484f58;
            margin-left: 6px;
            font-weight: 400;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .register-group {
            border-bottom: 1px solid #21262d;
        }

        .register-group-header {
            padding: 10px 12px;
            background: #0d1117;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            cursor: default;
        }

        .register-group-header .peer-name {
            color: #58a6ff;
            font-weight: 600;
        }

        .register-group-header .peer-id-label {
            color: #484f58;
            font-family: Consolas, monospace;
            font-size: 11px;
        }

        .register-item {
            padding: 6px 12px 6px 32px;
            border-top: 1px solid #161b22;
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 12px;
        }

        .register-item:hover { background: #1c2128; }

        .register-id-cell {
            font-family: Consolas, monospace;
            color: #c9d1d9;
            min-width: 180px;
        }

        .register-name-cell {
            color: #d2a8ff;
            flex: 1;
        }

        .register-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge-replica { background: #238636; color: #fff; }
        .badge-partial { background: #d29922; color: #fff; }
        .badge-public { background: #1f6feb; color: #fff; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 8px 12px;
            background: #0d1117;
            color: #8b949e;
            font-weight: 600;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid #21262d;
        }

        tr:hover td { background: #1c2128; }

        .peer-healthy { color: #3fb950; }
        .peer-unhealthy { color: #f85149; }

        .event-row {
            padding: 8px 12px;
            border-bottom: 1px solid #21262d;
            font-size: 13px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .event-row:hover { background: #1c2128; }

        .event-type {
            font-weight: 600;
            min-width: 130px;
            font-size: 12px;
        }

        .event-type-PeerConnected { color: #3fb950; }
        .event-type-PeerDisconnected { color: #f85149; }
        .event-type-PeerHeartbeat { color: #58a6ff; }
        .event-type-RegisterAdvertised { color: #d2a8ff; }
        .event-type-PeerListRequested { color: #79c0ff; }
        .event-type-PeerExchanged { color: #d29922; }
        .event-type-RelayForwarded { color: #f0883e; }
        .event-type-Error { color: #ff7b72; }
        .event-type-PeerHeartbeatRejected { color: #f97583; }
        .event-type-PeerReplaced { color: #da8ee7; }
        .event-type-PeerEvicted { color: #f97583; }

        .filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 8px 16px;
            border-bottom: 1px solid #30363d;
            background: #0d1117;
        }

        .filter-btn {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid #30363d;
            background: transparent;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .filter-btn.active { opacity: 1; }
        .filter-btn.inactive { opacity: 0.35; }

        .event-time {
            color: #484f58;
            font-size: 12px;
            min-width: 80px;
        }

        .event-peer {
            color: #c9d1d9;
            font-family: Consolas, monospace;
            font-size: 12px;
        }

        .event-detail {
            color: #8b949e;
            font-size: 12px;
            flex: 1;
        }

        .no-data {
            padding: 24px;
            text-align: center;
            color: #484f58;
            font-style: italic;
        }

        .event-count {
            font-size: 12px;
            color: #484f58;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    </style>
</head>
<body>
    <header>
        <h1>Sorcha Peer Router - Debug Console</h1>
        <span id="sse-status" class="status-badge status-connecting">Connecting...</span>
    </header>

    <div class="dashboard">
        <div class="panel full-width">
            <div class="panel-header">Health Status</div>
            <div class="health-grid" id="health-grid">
                <div class="health-card">
                    <div class="value" id="health-status">--</div>
                    <div class="label">Status</div>
                </div>
                <div class="health-card">
                    <div class="value" id="health-uptime">--</div>
                    <div class="label">Uptime</div>
                </div>
                <div class="health-card">
                    <div class="value" id="health-total">0</div>
                    <div class="label">Total Peers</div>
                </div>
                <div class="health-card">
                    <div class="value" id="health-healthy">0</div>
                    <div class="label">Healthy Peers</div>
                </div>
                <div class="health-card">
                    <div class="value" id="health-relay">--</div>
                    <div class="label">Relay</div>
                </div>
                <div class="health-card">
                    <div class="value" id="health-buffer">0</div>
                    <div class="label">Buffered Events</div>
                </div>
            </div>
        </div>

        <div class="panel full-width">
            <div class="tab-bar" id="tab-bar">
                <button class="tab-btn active" data-tab="peers">Peers<span class="tab-badge" id="peer-count">0</span></button>
                <button class="tab-btn" data-tab="events">Live Events<span class="tab-badge" id="event-count">0</span></button>
                <button class="tab-btn" data-tab="registers">Network Registers<span class="tab-badge" id="register-count">0</span></button>
            </div>

            <div class="tab-content active" id="tab-peers">
                <div class="panel-body">
                    <table>
                        <thead>
                            <tr>
                                <th>Node Name</th>
                                <th>Peer ID</th>
                                <th>Source IP</th>
                                <th>Status</th>
                                <th>Last Seen</th>
                                <th>Heartbeats</th>
                            </tr>
                        </thead>
                        <tbody id="peer-table-body">
                            <tr><td colspan="6" class="no-data">No peers connected</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="tab-content" id="tab-events">
                <div class="filter-bar" id="filter-bar"></div>
                <div class="panel-body" id="event-list">
                    <div class="no-data">Waiting for events...</div>
                </div>
            </div>

            <div class="tab-content" id="tab-registers">
                <div class="panel-body" id="register-list">
                    <div class="no-data">No registers advertised</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var MAX_VISIBLE_EVENTS = 100;
        var EVENT_TYPE_NAMES = [
            'PeerConnected','PeerDisconnected','PeerHeartbeat',
            'RegisterAdvertised','PeerListRequested','PeerExchanged',
            'RelayForwarded','Error','PeerHeartbeatRejected',
            'PeerReplaced','PeerEvicted'
        ];
        var EVENT_TYPE_COLORS = {
            PeerConnected: '#3fb950', PeerDisconnected: '#f85149',
            PeerHeartbeat: '#58a6ff', RegisterAdvertised: '#d2a8ff',
            PeerListRequested: '#79c0ff', PeerExchanged: '#d29922',
            RelayForwarded: '#f0883e', Error: '#ff7b72',
            PeerHeartbeatRejected: '#f97583',
            PeerReplaced: '#da8ee7', PeerEvicted: '#f97583'
        };
        var activeFilters = {};
        EVENT_TYPE_NAMES.forEach(function(t) { activeFilters[t] = true; });
        var events = [];
        var eventSource = null;
        var reconnectDelay = 1000;

        function formatTime(timestamp) {
            var d = new Date(timestamp);
            return d.toLocaleTimeString('en-GB', { hour12: false });
        }

        function formatUptime(uptimeStr) {
            if (!uptimeStr) return '--';
            var parts = uptimeStr.split(':');
            if (parts.length < 2) return uptimeStr;
            var hours = parseInt(parts[0], 10);
            var minutes = parseInt(parts[1], 10);
            var seconds = parseFloat(parts[2]) || 0;
            if (hours >= 24) {
                var days = Math.floor(hours / 24);
                var h = hours % 24;
                return days + 'd ' + h + 'h ' + minutes + 'm';
            }
            return hours + 'h ' + minutes + 'm ' + Math.floor(seconds) + 's';
        }

        function shortenPeerId(id) {
            if (!id) return '--';
            return id.length > 16 ? id.substring(0, 8) + '...' + id.substring(id.length - 6) : id;
        }

        function timeSince(timestamp) {
            var seconds = Math.floor((Date.now() - new Date(timestamp).getTime()) / 1000);
            if (seconds < 60) return seconds + 's ago';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            return Math.floor(seconds / 3600) + 'h ago';
        }

        function getTypeName(type) {
            if (typeof type === 'number') return EVENT_TYPE_NAMES[type] || 'Unknown';
            return type || 'Unknown';
        }

        function clearChildren(el) {
            while (el.firstChild) el.removeChild(el.firstChild);
        }

        function createTextEl(tag, text, className) {
            var el = document.createElement(tag);
            el.textContent = text;
            if (className) el.className = className;
            return el;
        }

        function buildFilterBar() {
            var bar = document.getElementById('filter-bar');
            clearChildren(bar);
            EVENT_TYPE_NAMES.forEach(function(t) {
                var btn = document.createElement('button');
                btn.textContent = t;
                btn.className = 'filter-btn ' + (activeFilters[t] ? 'active' : 'inactive');
                btn.style.color = EVENT_TYPE_COLORS[t] || '#c9d1d9';
                btn.style.borderColor = activeFilters[t] ? (EVENT_TYPE_COLORS[t] || '#30363d') : '#30363d';
                btn.onclick = function() {
                    activeFilters[t] = !activeFilters[t];
                    buildFilterBar();
                    renderEvents();
                };
                bar.appendChild(btn);
            });
        }

        function renderEvents() {
            var container = document.getElementById('event-list');
            var countEl = document.getElementById('event-count');
            countEl.textContent = events.length + ' events';

            clearChildren(container);

            var filtered = events.filter(function(evt) {
                return activeFilters[getTypeName(evt.type)];
            });

            if (filtered.length === 0) {
                container.appendChild(createTextEl('div',
                    events.length === 0 ? 'Waiting for events...' : 'No events match filter', 'no-data'));
                return;
            }

            for (var i = filtered.length - 1; i >= 0; i--) {
                var evt = filtered[i];
                var typeName = getTypeName(evt.type);

                var row = document.createElement('div');
                row.className = 'event-row';

                row.appendChild(createTextEl('span', formatTime(evt.timestamp), 'event-time'));
                row.appendChild(createTextEl('span', typeName, 'event-type event-type-' + typeName));

                var peerSpan = createTextEl('span', shortenPeerId(evt.peerId), 'event-peer');
                peerSpan.title = evt.peerId || '';
                row.appendChild(peerSpan);

                var source = (evt.ipAddress && evt.ipAddress !== 'unknown')
                    ? evt.ipAddress + (evt.port ? ':' + evt.port : '')
                    : shortenPeerId(evt.peerId);
                row.appendChild(createTextEl('span', source, 'event-detail'));

                container.appendChild(row);
            }
        }

        function renderPeers(data) {
            var tbody = document.getElementById('peer-table-body');
            var countEl = document.getElementById('peer-count');
            var peers = data.peers || [];
            countEl.textContent = peers.length + ' peers';

            clearChildren(tbody);

            if (peers.length === 0) {
                var tr = document.createElement('tr');
                var td = createTextEl('td', 'No peers connected', 'no-data');
                td.colSpan = 6;
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }

            for (var p = 0; p < peers.length; p++) {
                var peer = peers[p];
                var row = document.createElement('tr');

                var nameCell = createTextEl('td', peer.nodeName || '--');
                nameCell.style.color = peer.nodeName ? '#58a6ff' : '#484f58';
                nameCell.style.fontWeight = peer.nodeName ? '600' : 'normal';
                row.appendChild(nameCell);

                var idCell = createTextEl('td', shortenPeerId(peer.peerId));
                idCell.title = peer.peerId;
                idCell.style.color = '#8b949e';
                idCell.style.fontFamily = 'Consolas, monospace';
                idCell.style.fontSize = '12px';
                row.appendChild(idCell);

                var sourceIp = peer.ipAddress || '--';
                row.appendChild(createTextEl('td', sourceIp));

                var statusText = peer.isHealthy ? 'Healthy' : 'Unhealthy';
                var statusClass = peer.isHealthy ? 'peer-healthy' : 'peer-unhealthy';
                row.appendChild(createTextEl('td', statusText, statusClass));

                row.appendChild(createTextEl('td', timeSince(peer.lastSeen)));
                row.appendChild(createTextEl('td', String(peer.heartbeatCount || 0)));

                tbody.appendChild(row);
            }
        }

        function renderHealth(data) {
            document.getElementById('health-status').textContent = data.status || '--';
            document.getElementById('health-uptime').textContent = formatUptime(data.uptime);
            document.getElementById('health-total').textContent = data.totalPeers || 0;
            document.getElementById('health-healthy').textContent = data.healthyPeers || 0;
            document.getElementById('health-relay').textContent = data.relayEnabled ? 'Enabled' : 'Disabled';
            document.getElementById('health-buffer').textContent = data.eventBufferSize || 0;
        }

        function connectSSE() {
            var statusEl = document.getElementById('sse-status');
            statusEl.textContent = 'Connecting...';
            statusEl.className = 'status-badge status-connecting';

            eventSource = new EventSource('/events?follow');

            eventSource.onopen = function() {
                statusEl.textContent = 'Connected';
                statusEl.className = 'status-badge status-connected';
                reconnectDelay = 1000;
            };

            eventSource.onmessage = function(e) {
                try {
                    var evt = JSON.parse(e.data);
                    events.push(evt);
                    while (events.length > MAX_VISIBLE_EVENTS) {
                        events.shift();
                    }
                    renderEvents();
                } catch (err) {
                    // Skip malformed events
                }
            };

            eventSource.onerror = function() {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'status-badge status-disconnected';
                eventSource.close();
                setTimeout(function() {
                    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
                    connectSSE();
                }, reconnectDelay);
            };
        }

        function fetchPeers() {
            fetch('/peers').then(function(resp) {
                if (resp.ok) return resp.json();
                return null;
            }).then(function(data) {
                if (data) {
                    renderPeers(data);
                    renderNetworkRegisters(data);
                }
            }).catch(function() {});
        }

        function fetchHealth() {
            fetch('/health').then(function(resp) {
                if (resp.ok) return resp.json();
                return null;
            }).then(function(data) {
                if (data) renderHealth(data);
            }).catch(function() {});
        }

        // Tab switching
        var tabBar = document.getElementById('tab-bar');
        tabBar.addEventListener('click', function(e) {
            var btn = e.target.closest('.tab-btn');
            if (!btn) return;
            var tabName = btn.getAttribute('data-tab');
            tabBar.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            document.getElementById('tab-' + tabName).classList.add('active');
        });

        function renderNetworkRegisters(data) {
            var container = document.getElementById('register-list');
            var countEl = document.getElementById('register-count');
            var peers = data.peers || [];
            var totalRegisters = 0;

            clearChildren(container);

            for (var p = 0; p < peers.length; p++) {
                var peer = peers[p];
                var regs = peer.advertisedRegisters || [];
                if (regs.length === 0) continue;
                totalRegisters += regs.length;

                var group = document.createElement('div');
                group.className = 'register-group';

                var header = document.createElement('div');
                header.className = 'register-group-header';
                var nameSpan = createTextEl('span', peer.nodeName || 'Unknown', 'peer-name');
                header.appendChild(nameSpan);
                var idSpan = createTextEl('span', shortenPeerId(peer.peerId), 'peer-id-label');
                idSpan.title = peer.peerId;
                header.appendChild(idSpan);
                var statusSpan = createTextEl('span', peer.isHealthy ? 'Healthy' : 'Unhealthy',
                    peer.isHealthy ? 'peer-healthy' : 'peer-unhealthy');
                statusSpan.style.fontSize = '11px';
                statusSpan.style.marginLeft = 'auto';
                header.appendChild(statusSpan);
                group.appendChild(header);

                for (var r = 0; r < regs.length; r++) {
                    var reg = regs[r];
                    var item = document.createElement('div');
                    item.className = 'register-item';

                    item.appendChild(createTextEl('span', reg.registerId || '--', 'register-id-cell'));

                    var name = reg.name || reg.registerName || '';
                    item.appendChild(createTextEl('span', name || '(unnamed)', 'register-name-cell'));

                    if (reg.hasFullReplica) {
                        item.appendChild(createTextEl('span', 'Full Replica', 'register-badge badge-replica'));
                    } else {
                        item.appendChild(createTextEl('span', 'Partial', 'register-badge badge-partial'));
                    }

                    if (reg.isPublic) {
                        item.appendChild(createTextEl('span', 'Public', 'register-badge badge-public'));
                    }

                    var verSpan = createTextEl('span', 'v' + (reg.latestVersion || 0));
                    verSpan.style.color = '#484f58';
                    verSpan.style.fontSize = '11px';
                    verSpan.style.minWidth = '40px';
                    verSpan.style.textAlign = 'right';
                    item.appendChild(verSpan);

                    group.appendChild(item);
                }

                container.appendChild(group);
            }

            countEl.textContent = totalRegisters;

            if (totalRegisters === 0) {
                container.appendChild(createTextEl('div', 'No registers advertised', 'no-data'));
            }
        }

        buildFilterBar();
        connectSSE();
        fetchPeers();
        fetchHealth();

        setInterval(fetchPeers, 5000);
        setInterval(fetchHealth, 5000);
    </script>
</body>
</html>
