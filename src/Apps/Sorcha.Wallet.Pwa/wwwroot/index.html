<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorcha Wallet</title>
    <base href="/wallet/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/welcome-takeover.css" rel="stylesheet" />
    <link href="css/splash.css" rel="stylesheet" />
    <!-- Blazor CSS-isolation bundle — without this, every component .razor.css
         (incl. the Feature 141 wallet chrome + shared Sorcha.UI.Components.User
         scoped styles) is never loaded and components render unstyled. -->
    <link href="Sorcha.Wallet.Pwa.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div id="sorcha-splash" class="sorcha-splash" role="status" aria-live="polite"
             aria-label="Loading Sorcha Wallet">
            <canvas id="sorcha-splash-canvas" aria-hidden="true"></canvas>
            <div class="sorcha-splash-center">
                <div class="sorcha-splash-mark"><span>S</span></div>
                <div class="sorcha-splash-wordmark">Sorcha Wallet</div>
                <div class="sorcha-splash-subword">Your proof, your device</div>
            </div>
            <div class="sorcha-splash-ind">
                <div class="sorcha-splash-bar" id="sorcha-splash-bar">
                    <div class="sorcha-splash-track">
                        <div class="sorcha-splash-fill" id="sorcha-splash-fill"></div>
                    </div>
                    <div class="sorcha-splash-pct" id="sorcha-splash-pct">0%</div>
                </div>
                <div class="sorcha-splash-text" id="sorcha-splash-text">
                    <div class="sorcha-splash-status" id="sorcha-splash-status">Starting up…</div>
                    <div class="sorcha-splash-dots"><i></i><i></i><i></i></div>
                </div>
            </div>
        </div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/webcrypto-bridge.js"></script>
    <script src="js/xchacha-bridge.js"></script>
    <script src="js/indexeddb-bridge.js"></script>
    <script src="js/device-profile.js"></script>
    <script src="js/qr-scanner-bridge.js"></script>
    <script src="js/connectivity.js"></script>
    <script src="js/auth-fragment.js"></script>
    <script src="js/splash-render.js"></script>
    <script src="js/splash.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        // Service worker registered separately by Blazor in Release builds.
    </script>
</body>
</html>
