# nginx config for the Sorcha citizen wallet PWA.
# Long-cache hashed assets, no-cache on the SPA shell and service worker.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed Blazor assets — immutable, can cache for a year.
    location ~* ^/_framework/.*\.(dll|wasm|js|json|blat|dat)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hashed framework + asset manifests must always revalidate so a wallet
    # update is picked up on next visit, not silently cached for 24h.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }
    location = /service-worker-assets.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Manifest + icons — short cache so a re-skin lands quickly.
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    location ~* ^/icons/.*\.(png|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback — Blazor handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
