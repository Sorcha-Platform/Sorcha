openapi: 3.1.0
info:
  title: Sorcha Org DID Document Endpoint
  version: 1.0.0
  summary: Public endpoint for resolving organisation DID documents (Feature 120).
  description: |
    Sorcha publishes a W3C DID document for every organisation that has an active issuance key.
    The document is reachable at a stable, well-known URL conforming to the `did:web` resolution
    rules in W3C DID Core 1.0.

    For an organisation hosted under the platform domain `{platform-domain}` with id `{orgId}`,
    the federated DID identifier is:

        did:web:{platform-domain}:orgs:{orgId}

    Per the `did:web` method specification, this DID resolves to the URL:

        https://{platform-domain}/orgs/{orgId}/did.json

    External standards-compliant DID resolvers can dereference this document with no
    Sorcha-specific knowledge.

    The endpoint is anonymous, CDN-cacheable, and conforms to the W3C DID Core 1.0 document
    schema (https://www.w3.org/TR/did-core/).

servers:
  - url: https://{platformDomain}
    variables:
      platformDomain:
        default: example.sorcha.dev
        description: Platform domain configured at deploy time.

paths:
  /orgs/{orgId}/did.json:
    get:
      summary: Resolve an organisation's DID document.
      description: |
        Returns the published W3C DID document for the organisation `orgId`. The document
        declares the organisation's signing keys (verification methods) and an `alsoKnownAs`
        link to the equivalent `did:sorcha:org:{walletAddress}` identifier.

        Cache headers: `Cache-Control: public, max-age=21600` (6 hours). Explicit cache
        invalidation occurs on key events (rotation, revocation, additional key derivation).
      operationId: resolveOrgDidDocument
      tags: [Discovery]
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The organisation's platform identifier.
      security: []  # Anonymous; CDN-cacheable.
      responses:
        '200':
          description: DID document found and returned.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `public, max-age=21600`.
          content:
            application/did+json:
              schema:
                $ref: '#/components/schemas/DidDocument'
              examples:
                exampleOrg:
                  summary: An organisation with one active issuance key.
                  value:
                    "@context":
                      - "https://www.w3.org/ns/did/v1"
                      - "https://w3id.org/security/suites/jws-2020/v1"
                    id: "did:web:example.sorcha.dev:orgs:abc-123-def-456-789-aaaaaaaaaaaa"
                    alsoKnownAs:
                      - "did:sorcha:org:ws1qta0sk6m4yzgf5...example..."
                    verificationMethod:
                      - id: "did:web:example.sorcha.dev:orgs:abc-123-def-456-789-aaaaaaaaaaaa#vc-issuance-1"
                        type: "JsonWebKey2020"
                        controller: "did:web:example.sorcha.dev:orgs:abc-123-def-456-789-aaaaaaaaaaaa"
                        publicKeyMultibase: "z6MkpTHR8VNsBxYAAWHut2Geadd9jSwuBV8xRoAnwWsdvktH"
                      - id: "did:web:example.sorcha.dev:orgs:abc-123-def-456-789-aaaaaaaaaaaa#dGhpc0lzVGhlVGh1bWJwcmludE9mVGhlS2V5LjEyMzQ"
                        type: "JsonWebKey2020"
                        controller: "did:web:example.sorcha.dev:orgs:abc-123-def-456-789-aaaaaaaaaaaa"
                        publicKeyMultibase: "z6MkpTHR8VNsBxYAAWHut2Geadd9jSwuBV8xRoAnwWsdvktH"
                    assertionMethod:
                      - "did:web:example.sorcha.dev:orgs:abc-123-def-456-789-aaaaaaaaaaaa#vc-issuance-1"
                      - "did:web:example.sorcha.dev:orgs:abc-123-def-456-789-aaaaaaaaaaaa#dGhpc0lzVGhlVGh1bWJwcmludE9mVGhlS2V5LjEyMzQ"
        '404':
          description: |
            No DID document found for this organisation. Either the organisation does not exist,
            or it has not yet issued its first credential (no issuance key derived).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{orgId}/did-document/regenerate:
    post:
      summary: Regenerate an organisation's published DID document from a key snapshot.
      description: |
        Internal Wallet → Tenant trigger, called after a key event (issuance key derivation,
        rotation, or revocation). Rebuilds the document from the supplied key snapshot, persists
        it, and returns the new version. Idempotent: returns the existing row unchanged when the
        recomputed key-version fingerprint is unchanged.

        **This is a privileged write path, NOT a public one.** The document it publishes is the
        issuer key material every verifier trusts for this organisation, and the canonical
        identifier is derived verbatim from the supplied `walletAddress` as
        `did:sorcha:org:{walletAddress}`. Two controls apply:

        1. **`RequireService`** — a service-tier token is mandatory. Anonymous callers and human
           tokens of any role (including Administrator) are refused. This endpoint carried no
           authorization attribute at all until the 2026-07-29 catch-up security review; because
           the Tenant Service configures no fallback policy, it was reachable anonymously on the
           published Tenant port, allowing an attacker to publish their own key as any
           organisation's issuer key.
        2. **Canonical wallet-address check** — `walletAddress` must equal the organisation's
           recorded canonical wallet address. An organisation with no recorded address yet is
           permitted (with a warning) so first-time publication is not broken — but permissive
           does not mean unvalidated. On that path the address must still be non-blank (a blank
           one would publish the degenerate `did:sorcha:org:`, which every organisation taking the
           path would collide on) and must not already be published as a **different**
           organisation's DID. `PrimaryDid` is a non-unique index resolved by an unordered
           `FirstOrDefault`, so two rows sharing one would make the public by-DID route serve
           either organisation's key material — cross-org issuer-key confusion.
      operationId: regenerateOrgDidDocument
      tags: [Internal]
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The organisation's platform identifier. Must equal body `organizationId`.
      security:
        - serviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgDidRegenerateRequest'
      responses:
        '200':
          description: Document regenerated (or unchanged, when the fingerprint already matched).
        '400':
          description: |
            Route `orgId` did not match body `organizationId`; unknown organisation; or
            `walletAddress` is not the organisation's canonical wallet address.
        '401':
          description: No service-tier token presented.
        '403':
          description: Token presented is not service-tier (e.g. a human or admin token).

components:
  securitySchemes:
    serviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Service-tier Sorcha JWT — `token_type=service` plus this installation's `:service`
        audience (see the `RequireService` policy). Minted via the OAuth2 client-credentials
        grant against the Tenant Service and attached by `IServiceAuthClient`.

  schemas:
    OrgDidRegenerateRequest:
      type: object
      description: Wallet → Tenant snapshot of the organisation's Active issuance keys.
      required: [organizationId, keyEventReason, walletAddress, activeKeys]
      properties:
        organizationId:
          type: string
          format: uuid
          description: Owning organisation. Must equal the route `orgId`.
        keyEventReason:
          type: string
          description: What triggered regeneration (key derivation, rotation, revocation).
        walletAddress:
          type: string
          description: |
            Organisation wallet address forming the canonical `did:sorcha:org:{addr}` identifier.
            Validated against the organisation's recorded canonical address.
        activeKeys:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrgDidActiveKey' }

    OrgDidActiveKey:
      type: object
      required: [rotationIndex, algorithm, publicKeyJwk, thumbprint]
      properties:
        rotationIndex:
          type: integer
          description: Monotonic rotation counter; forms the versioned kid suffix.
        algorithm:
          type: string
          description: Wallet algorithm string (e.g. `ED25519`).
        publicKeyJwk:
          type: string
          description: Pre-built JWK JSON for the public key.
        thumbprint:
          type: string
          description: RFC 7638 SHA-256 base64url thumbprint of the JWK.

    DidDocument:
      type: object
      description: |
        W3C DID Document per https://www.w3.org/TR/did-core/. Sorcha-issued documents always
        carry `alsoKnownAs`, dual `verificationMethod` entries per active key (one versioned,
        one thumbprint-keyed), and `assertionMethod` referencing all active VMs.
      required: ["@context", "id", "verificationMethod", "assertionMethod"]
      properties:
        "@context":
          type: array
          items: { type: string }
          minItems: 1
        id:
          type: string
          description: The primary DID this document describes.
        alsoKnownAs:
          type: array
          items: { type: string }
          description: Equivalent identifiers for this organisation (e.g., did:sorcha:org form).
        verificationMethod:
          type: array
          items: { $ref: '#/components/schemas/VerificationMethod' }
          minItems: 1
        assertionMethod:
          type: array
          items: { type: string }
          description: Verification method ids permitted for credential issuance.
        authentication:
          type: array
          items: { type: string }
          description: Verification method ids permitted for authentication.

    VerificationMethod:
      type: object
      required: [id, type, controller]
      properties:
        id:
          type: string
          description: |
            Fragment-suffixed identifier. Sorcha publishes two per active key:
              - Versioned: `{did}#vc-issuance-{n}` (n is monotonic, starts at 1)
              - Thumbprint: `{did}#{rfc7638-base64url-thumbprint}` (43 chars, no padding)
        type:
          type: string
          description: W3C verification method type (e.g., Ed25519VerificationKey2020, JsonWebKey2020).
        controller:
          type: string
        publicKeyMultibase:
          type: string
          description: Multibase-encoded (base58btc) multicodec public key.
        publicKeyJwk:
          type: object
          description: JWK form (alternative to multibase). Sorcha currently emits multibase.

    ProblemDetails:
      type: object
      description: RFC 7807 problem details.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
