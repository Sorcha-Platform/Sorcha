openapi: 3.0.3
info:
  title: Sorcha — Password Management
  version: "1.0.0"
  description: |
    Self-service password lifecycle for a signed-in user. Set, change,
    or remove the password from inside Settings. Every operation is
    gated by the re-authentication challenge primitive except the
    bootstrap case (SetPassword when the user has zero other methods).
servers:
  - url: https://api.sorcha.dev
paths:
  /api/auth/password/set:
    post:
      operationId: SetPassword
      tags: [Password]
      summary: Set an initial password
      description: |
        For users with no current password. Bootstrap mode (zero other
        methods) bypasses the challenge requirement; otherwise the
        `X-Auth-Challenge` header is required (issued for `SetPassword`).
      security:
        - bearerAuth: []
      parameters:
        - name: X-Auth-Challenge
          in: header
          required: false
          schema: { type: string }
          description: Required unless user has zero other sign-in methods.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "204": { description: Password set }
        "400": { description: Password fails policy }
        "401": { description: Challenge missing or invalid (and not in bootstrap mode) }
        "409": { description: Password already set — use change endpoint }
  /api/auth/password/change:
    post:
      operationId: ChangePassword
      tags: [Password]
      summary: Rotate the password
      description: |
        Old password is not re-checked here — the challenge already
        proved possession. Returns 409 if no password is currently set.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Auth-Challenge
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "204": { description: Password rotated }
        "400": { description: New password fails policy }
        "401": { description: Challenge missing or invalid }
        "409": { description: No password currently set — use set endpoint }
  /api/auth/password/remove:
    post:
      operationId: RemovePassword
      tags: [Password]
      summary: Clear the password
      description: |
        Last-method floor enforced server-side. Returns 409 if removing
        would leave zero sign-in methods.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Auth-Challenge
          in: header
          required: true
          schema: { type: string }
      responses:
        "204": { description: Password removed }
        "401": { description: Challenge missing or invalid }
        "409":
          description: |
            Either no password to remove, or removing would violate
            the last-method floor.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          description: Subject to existing platform password policy.
