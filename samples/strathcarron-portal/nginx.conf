# nginx config for the Strathcarron Council sample portal (F127).
# Blazor WASM served as a SPA — deep routes fall back to index.html so
# client-side routing handles /services/driving-licence, /services/blue-badge etc.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor's two non-fingerprinted entry-point JS files must always
    # revalidate so a portal redeploy lands cleanly on next visit.
    location = /_framework/dotnet.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /_framework/blazor.webassembly.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Hashed Blazor assets — immutable, cache for a year.
    location ~* ^/_framework/.*\.(dll|wasm|js|json|blat|dat)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Sorcha platform API. The sample portal lives at its own origin
    # (port 8082 by default), separate from the api-gateway (port 80).
    # Proxy /api/* through to the gateway service inside the Docker
    # network so client-side fetch + SignalR calls don't 404 against
    # the SPA fallback. This is also the production shape — a real
    # council portal would proxy /api to the Sorcha platform's public API.
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Sorcha SignalR hubs (/hubs/tenant, /hubs/blueprint, ...).
    # Same proxy as /api/ but with the WebSocket Upgrade headers
    # SignalR needs.
    location /hubs/ {
        proxy_pass http://api-gateway:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # SPA fallback — Blazor handles client-side routing for
    # /services/driving-licence, /services/blue-badge, etc. MUST come
    # AFTER the /api/ and /hubs/ proxy locations or it'll absorb them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
