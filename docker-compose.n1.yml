#
# Docker Compose override for n1.sorcha.dev debug deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.n1.yml up -d
#
# This override:
# - Sets INSTALLATION_NAME to n1.sorcha.dev (JWT issuer/audience)
# - Pulls pre-built images from DockerHub (sorchadev/*)
# - Configures peer service identity as n1.sorcha.dev
# - SSL handled by Caddy installed on the host (not in Docker)

x-jwt-env: &jwt-env
  JwtSettings__InstallationName: n1.sorcha.dev
  JwtSettings__SigningKey: ${JWT_SIGNING_KEY:-c29yY2hhLW4xLXNvcmNoYS1kZXYta2V5LTIwMjYtbWluLTI1Ni1iaXRzLXNlY3VyZQ==}

services:
  # ===========================
  # Application Services - override JWT and peer config
  # ===========================

  blueprint-service:
    image: sorchadev/blueprint-service:latest
    environment:
      <<: *jwt-env
      AIProvider__ApiKey: ${ANTHROPIC_API_KEY:-}

  wallet-service:
    image: sorchadev/wallet-service:latest
    environment:
      <<: *jwt-env

  register-service:
    image: sorchadev/register-service:latest
    environment:
      <<: *jwt-env
      # SyncOnly until federation onboarding is designed (#461 phase 3+).
      # Auto attempts genesis ingest, but n1's validator-service uses
      # wallet 'local-validator' which is not in the embedded genesis's
      # validator roster (the genesis names ws11qpej4g…). Without a
      # multi-wallet validator or a re-run of the genesis ceremony per
      # deployment, the genesis ingest leaves the system register stub-
      # state with no docket sealed.
      SystemRegister__BootstrapMode: SyncOnly

  tenant-service:
    image: sorchadev/tenant-service:latest
    environment:
      <<: *jwt-env
      Fido2__ServerDomain: n1.sorcha.dev
      Fido2__ServerName: Sorcha
      Fido2__Origins__0: https://n1.sorcha.dev
      # n1 is the shared dev/demo node. Walkthrough setup scripts create
      # bursts of users in one run — 7 for SelfBuildHouse, 5 for ConstructionPermit.
      # The baked-in 10/min PlatformAuth limit is brute-force protection for
      # production and is inappropriate here, so loosen it. Other policies
      # (TOTP, Strict) keep their production defaults.
      RateLimiting__PlatformAuthPermitLimit: 500
      RateLimiting__PlatformAuthQueueLimit: 100
      # n1 is a public demo node — render an informational banner on auth pages
      # so visitors know the environment may be reset without notice. Plain
      # informational notice; no consent gate, no friction.
      DemoEnvironment__Enabled: "true"
      # Public organisation is enabled at first DB seed so a freshly-reset n1
      # supports social signup without an admin manually flipping the toggle.
      # After first seed the value persists in tenant.platform_settings; this
      # env var is only consulted when seeding a fresh database. Feature 115.
      PlatformSettings__SeedPublicOrgEnabled: "true"
      # OAuth callback base URL — explicit because Caddy terminates TLS on
      # the host and the proxy chain (Caddy → api-gateway → tenant-service)
      # does not always propagate X-Forwarded-Proto cleanly, causing
      # http:// to leak into the redirect_uri sent to providers and yielding
      # redirect_uri_mismatch errors. Set the public origin explicitly per
      # feature 115 FR-021.
      OAuth__CallbackBaseUrl: https://n1.sorcha.dev
      # Social login providers — feature 115. ClientId/ClientSecret are
      # interpolated from the host's /opt/sorcha/.env file (gitignored).
      # Buttons for unconfigured providers are hidden client-side, so leaving
      # any of these blank cleanly disables that provider on this environment.
      # Setup runbook: docs/guides/SOCIAL-LOGIN-SETUP.md
      SocialProviders__0__Name: Google
      SocialProviders__0__ClientId: ${GOOGLE_OAUTH_CLIENT_ID:-}
      SocialProviders__0__ClientSecret: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      SocialProviders__1__Name: GitHub
      SocialProviders__1__ClientId: ${GITHUB_OAUTH_CLIENT_ID:-}
      SocialProviders__1__ClientSecret: ${GITHUB_OAUTH_CLIENT_SECRET:-}

  peer-service:
    image: sorchadev/peer-service:latest
    ports: !override
      - "5001:5000"      # gRPC P2P — Caddy on host proxies 50051 → 5001
    environment:
      <<: *jwt-env
      PeerService__NodeId: n1.sorcha.dev
      PeerService__PublicAddress: ${N1_PUBLIC_IP:-n1.sorcha.dev}

  validator-service:
    image: sorchadev/validator-service:latest
    environment:
      <<: *jwt-env

  haip-service:
    image: sorchadev/haip-service:latest
    environment:
      <<: *jwt-env
      # Credential offers embed this URL as the credential_issuer; the agent
      # receiving the offer dereferences /.well-known/openid-credential-issuer
      # against it, so it must be the public URL, not the internal 127.0.0.1
      # default baked into docker-compose.yml.
      Haip__IssuerUrl: https://n1.sorcha.dev

  sorcha-ui-web:
    image: sorchadev/ui-web:latest

  api-gateway:
    image: sorchadev/api-gateway:latest
    ports:
      - "8880:8080"    # Internal only - Caddy on host handles 80/443
    environment:
      <<: *jwt-env
      Dashboard__AspireDashboardUrl: https://n1.sorcha.dev:18888
      # Disable HTTPS on gateway - Caddy handles TLS
      ASPNETCORE_URLS: http://+:8080
