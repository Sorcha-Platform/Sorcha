#
# Docker Compose override for n1.sorcha.dev debug deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.n1.yml up -d
#
# This override:
# - Sets INSTALLATION_NAME to n1.sorcha.dev (JWT issuer/audience)
# - Pulls pre-built images from DockerHub (sorchadev/*)
# - Configures peer service identity as n1.sorcha.dev
# - SSL handled by Caddy installed on the host (not in Docker)

x-jwt-env: &jwt-env
  JwtSettings__InstallationName: n1.sorcha.dev
  JwtSettings__SigningKey: ${JWT_SIGNING_KEY:-c29yY2hhLW4xLXNvcmNoYS1kZXYta2V5LTIwMjYtbWluLTI1Ni1iaXRzLXNlY3VyZQ==}

services:
  # ===========================
  # Application Services - override JWT and peer config
  # ===========================

  blueprint-service:
    image: sorchadev/blueprint-service:latest
    environment:
      <<: *jwt-env
      AIProvider__ApiKey: ${ANTHROPIC_API_KEY:-}

  wallet-service:
    image: sorchadev/wallet-service:latest
    environment:
      <<: *jwt-env

  register-service:
    image: sorchadev/register-service:latest
    environment:
      <<: *jwt-env
      # n1 is the seed node for the sorcha-dev network. Auto mode runs the
      # genesis-ingest path on first boot when no peer is available. PR #465
      # added /api/v1/wallets/system/recover so the genesis-ceremony key can
      # be imported into the validator's system wallet pre-deploy, and this
      # PR pre-creates the register row with the genesis control record so
      # validator-service enrols on its 30s reconcile cycle and seals docket 0.
      # Replicas joining the network use SyncOnly via per-deployment overrides.
      SystemRegister__BootstrapMode: Auto

  tenant-service:
    image: sorchadev/tenant-service:latest
    environment:
      <<: *jwt-env
      # Passkey relying-party = the PARENT domain sorcha.dev (not the per-host
      # subdomain) so one passkey works across every *.sorcha.dev installation and
      # matches the native apps' Associated Domains entitlement (webcredentials:sorcha.dev)
      # + the AASA/assetlinks served at https://sorcha.dev/.well-known/. WebAuthn allows
      # the RP ID to be a registrable parent of the ceremony origin, which stays the
      # actual host the app/web runs on (https://n1.sorcha.dev).
      Fido2__ServerDomain: sorcha.dev
      Fido2__ServerName: Sorcha
      Fido2__Origins__0: https://n1.sorcha.dev
      # n1 is the shared dev/demo node. Walkthrough setup scripts create
      # bursts of users in one run — 7 for SelfBuildHouse, 5 for ConstructionPermit.
      # The baked-in 10/min PlatformAuth limit is brute-force protection for
      # production and is inappropriate here, so loosen it. Other policies
      # (TOTP, Strict) keep their production defaults.
      RateLimiting__PlatformAuthPermitLimit: 500
      RateLimiting__PlatformAuthQueueLimit: 100
      # n1 is a public demo node — render an informational banner on auth pages
      # so visitors know the environment may be reset without notice. Plain
      # informational notice; no consent gate, no friction.
      DemoEnvironment__Enabled: "true"
      # Demo node: allow SystemAdmin-provisioned pre-verified org-scoped users so walkthrough
      # setup scripts create single-org operators (no public-user / multi-org clash). Off in
      # real production; explicit here for the demo. Spec 136 follow-up.
      Platform__AllowAdminVerifiedUserCreation: "true"
      # Public organisation is enabled at first DB seed so a freshly-reset n1
      # supports social signup without an admin manually flipping the toggle.
      # After first seed the value persists in tenant.platform_settings; this
      # env var is only consulted when seeding a fresh database. Feature 115.
      PlatformSettings__SeedPublicOrgEnabled: "true"
      # OAuth callback base URL — explicit because Caddy terminates TLS on
      # the host and the proxy chain (Caddy → api-gateway → tenant-service)
      # does not always propagate X-Forwarded-Proto cleanly, causing
      # http:// to leak into the redirect_uri sent to providers and yielding
      # redirect_uri_mismatch errors. Set the public origin explicitly per
      # feature 115 FR-021.
      OAuth__CallbackBaseUrl: https://n1.sorcha.dev
      # The enrolment QR sends the citizen's phone to THIS installation's wallet PWA
      # (/wallet/enrol), so it must carry n1's origin. Unset, the service falls back to
      # Email:BaseUrl — which the smtp override supplies — but pin it here so a standing
      # `up` without the smtp override can never emit a QR pointing at the demo domain.
      EnrolSession__CouncilOrigin: https://n1.sorcha.dev
      # Social login providers — feature 115. ClientId/ClientSecret are
      # interpolated from the host's /opt/sorcha/.env file (gitignored).
      # Buttons for unconfigured providers are hidden client-side, so leaving
      # any of these blank cleanly disables that provider on this environment.
      # Setup runbook: docs/guides/SOCIAL-LOGIN-SETUP.md
      SocialProviders__0__Name: Google
      SocialProviders__0__ClientId: ${GOOGLE_OAUTH_CLIENT_ID:-}
      SocialProviders__0__ClientSecret: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      SocialProviders__1__Name: GitHub
      SocialProviders__1__ClientId: ${GITHUB_OAUTH_CLIENT_ID:-}
      SocialProviders__1__ClientSecret: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      # F191 (#1420) retire switch — n1 runs cert-only service-to-service auth.
      # Every service mints its service token against the Tenant mTLS listener
      # (https://tenant-service:8443) with its workload certificate; this refuses
      # any secret-presenting mint with an explicit 400. Live-verified on n1
      # 2026-08-15 (SC-007) before being folded in here.
      #
      # It lives in THIS file, not a separate override, deliberately: the flag was
      # briefly carried by a 4th compose file on the box, so the documented 3-file
      # `-f` command silently dropped it on the next tenant-service recreate — a
      # posture regression with no error. n1's standard command now carries it.
      #
      # Precondition (already met on n1): the F191 workload-certificate block must
      # be present in the host .env (8 client certs + CA bundle + server cert +
      # WORKLOAD_CERT_PASSWORD, provisioned by /opt/sorcha/f191-provision.sh).
      # Without it no service can mint at all. Rollback: comment this out and
      # `up -d --force-recreate --no-deps tenant-service`.
      ServiceAuth__DisableSharedSecrets: "true"

  peer-service:
    image: sorchadev/peer-service:latest
    ports: !override
      - "5001:5000"      # gRPC P2P — Caddy on host proxies 50051 → 5001
    environment:
      <<: *jwt-env
      PeerService__NodeId: n1.sorcha.dev
      # n1 is the public rendezvous anchor for NAT'd federated nodes (F143). PublicAddress
      # was a dead env var (no such config property) — rendezvous-capability is derived from
      # NetworkAddress.ExternalAddress (or the explicit RelayRendezvousEnabled flag). Without
      # this, n1 rejects NAT'd owners' reverse streams and cross-node app-register sync fails.
      # See issue #909.
      PeerService__NetworkAddress__ExternalAddress: ${N1_PUBLIC_IP:-n1.sorcha.dev}
      PeerService__RelayRendezvousEnabled: "true"

  validator-service:
    image: sorchadev/validator-service:latest
    environment:
      <<: *jwt-env

  haip-service:
    image: sorchadev/haip-service:latest
    environment:
      <<: *jwt-env
      # Credential offers embed this URL as the credential_issuer; the agent
      # receiving the offer dereferences /.well-known/openid-credential-issuer
      # against it, so it must be the public URL, not the internal 127.0.0.1
      # default baked into docker-compose.yml.
      Haip__IssuerUrl: https://n1.sorcha.dev
      # PR #580 — HAIP needs a ServiceAuth client (IDidResolverRegistry construction
      # transitively resolves ServiceAuthClient via SorchaDidResolver → IWalletServiceClient).
      # Compose's environment-block merge replaces rather than additive-merges the base
      # docker-compose.yml block when an override declares its own environment, so these
      # have to be repeated here. F120's required-issuer-signature default surfaces the
      # absence of this config as a 500 on every presentation submission.
      ServiceClients__BlueprintService__Address: http://blueprint-service:8080
      ServiceClients__TenantService__Address: http://tenant-service:8080
      ServiceAuth__ClientId: service-haip
      # Same var/spelling as the base compose (#1423) — required because this
      # override REPLACES (not additive-merges) the base haip-service
      # environment block, so the guard has to be repeated here too. n1's
      # .env already supplies HAIP_SERVICE_SECRET for the base compose; no
      # new var introduced.
      ServiceAuth__ClientSecret: ${HAIP_SERVICE_SECRET:?not set — run ./scripts/sorcha-setup.sh to generate .env (see README Quick Start); bare docker compose up is unsupported}
      ServiceAuth__Scopes: "blueprints:read"

  sorcha-ui-web:
    image: sorchadev/ui-web:latest

  api-gateway:
    image: sorchadev/api-gateway:latest
    ports:
      - "8880:8080"    # Internal only - Caddy on host handles 80/443
    environment:
      <<: *jwt-env
      Dashboard__AspireDashboardUrl: https://n1.sorcha.dev:18888
      # Disable HTTPS on gateway - Caddy handles TLS
      ASPNETCORE_URLS: http://+:8080
      # Rate limits (#1437): this override MERGES with the base api-gateway environment
      # (compose unions environment maps across -f files), so n1's gateway inherits the base
      # RateLimiting__* production limits (api 600/min, auth 60/min, strict 60 tokens, all
      # QueueLimit=0). n1 is the public edge this fix targets, so it is deliberately NOT loosened
      # here. Only tenant-service's PlatformAuth is loosened above, for walkthrough user-creation
      # bursts. To relax a gateway limit for a demo, set the RATELIMIT_* vars in the host .env.
