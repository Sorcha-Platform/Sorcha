#
# Secret-scan CI gate. Fails when any file under src/ or scripts/, or a
# root-level docker-compose*.yml, contains what looks like a hardcoded
# secret (client/service secret, API key, password, PEM private key)
# outside the explicit allowlist (.secrets-allowlist). The allowlist is a
# ratchet — it may only shrink.
#
# See scripts/check-secrets.ps1 for the pattern list and allowlist rationale.

name: secrets-gate

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "docker-compose*.yml"
      - ".secrets-allowlist"
      - "scripts/check-secrets.ps1"
      - ".github/workflows/secrets-gate.yml"
  workflow_dispatch:

jobs:
  no-committed-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run secret-scan gate
        shell: pwsh
        run: ./scripts/check-secrets.ps1
