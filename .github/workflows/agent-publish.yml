name: Agent Publish — Pack & Push .NET Global Tool

on:
  push:
    branches: [ master ]
    # The tool's own sources AND every project it links — see the note in cli-publish.yml for why
    # the tool directory alone is not enough. It matters more here: the agent's decision path runs
    # through Sorcha.Blueprint.Engine and Sorcha.ServiceClients.Http, so a change there can alter
    # what the agent approves without touching a single file under src/Apps/Sorcha.Agent. F176
    # (#1136) fixed a fail-open that approved a fake postcode; a stale-dependency publish is a
    # route back to that class of defect.
    #
    # Keep this list in step with the ProjectReferences in
    # src/Apps/Sorcha.Agent/Sorcha.Agent.csproj — that csproj is the source of truth.
    paths:
      - 'src/Apps/Sorcha.Agent/**'
      - 'src/Common/Sorcha.Cryptography/**'
      - 'src/Common/Sorcha.ServiceClients.Http/**'
      - 'src/Common/Sorcha.Blueprint.Models/**'
      - 'src/Core/Sorcha.Blueprint.Engine/**'
      - 'Directory.Build.props'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Version is derived at build time by the unified scheme in the root
      # Directory.Build.props — 2.<run_number>.<run_attempt> in CI. No bump/commit.
      - name: Pack
        run: dotnet pack src/Apps/Sorcha.Agent/ --configuration Release -o ./nupkg

      - name: Publish to NuGet.org
        # Push ONLY the tool package. `dotnet pack` on the tool also packs every project it
        # references — they set GeneratePackageOnBuild — so a `*.nupkg` glob published eight
        # packages, versioning the shared libraries with THIS workflow's run number instead of
        # nuget-publish.yml's. That is how Sorcha.Tenant.Models acquired 2.30.1-2.37.1 alongside
        # its real 2.291.1: non-monotonic duplicates of libraries this workflow does not own.
        run: dotnet nuget push ./nupkg/Sorcha.Agent.*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
