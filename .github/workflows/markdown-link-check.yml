name: Check Markdown Links

on:
  pull_request:
    paths:
      - '**/*.md'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            '**/*.md'
          fail: true
