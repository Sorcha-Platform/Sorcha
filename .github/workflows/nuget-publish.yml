name: NuGet Publish — Auto Version & Release

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Common/**'
      - 'src/Core/**'

  workflow_dispatch:
    inputs:
      force_publish_all:
        description: 'Force publish all packages'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_libraries: ${{ steps.detect.outputs.changed_libraries }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed libraries
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FORCE: ${{ github.event.inputs.force_publish_all }}
        run: |
          ALL_LIBS='["Sorcha.Register.Models","Sorcha.Tenant.Models","Sorcha.Blueprint.Models","Sorcha.Storage.Abstractions","Sorcha.Cryptography","Sorcha.Blueprint.Schemas","Sorcha.Blueprint.Schemas.Client","Sorcha.Storage.InMemory","Sorcha.Storage.MongoDB","Sorcha.Storage.Redis","Sorcha.TransactionHandler","Sorcha.Validator.Core","Sorcha.Wallet.Core","Sorcha.Wallet.Portable","Sorcha.ServiceClients","Sorcha.ServiceClients.Http","Sorcha.ServiceDefaults","Sorcha.Blueprint.Engine","Sorcha.Blueprint.Fluent","Sorcha.Register.Core","Sorcha.Register.Storage","Sorcha.Register.Storage.InMemory","Sorcha.Register.Storage.MongoDB","Sorcha.Register.Storage.Redis"]'

          if [ "$FORCE" == "true" ]; then
            CHANGED="$ALL_LIBS"
          else
            # Diff the pushed range. Version is now derived at build time (no
            # version-bump commits to anchor on), so change-detection is a plain
            # git diff of each library's directory.
            BASE="$BEFORE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            CHANGED_FILES="$(git diff --name-only "$BASE" "$SHA" -- src/Common src/Core || true)"

            CHANGED="["
            FIRST=true
            for LIB in $(echo "$ALL_LIBS" | jq -r '.[]'); do
              DIR=""
              [ -d "src/Common/$LIB" ] && DIR="src/Common/$LIB"
              [ -d "src/Core/$LIB" ] && DIR="src/Core/$LIB"
              [ -z "$DIR" ] && continue
              if echo "$CHANGED_FILES" | grep -q "^$DIR/"; then
                if [ "$FIRST" = true ]; then FIRST=false; else CHANGED="$CHANGED,"; fi
                CHANGED="$CHANGED\"$LIB\""
              fi
            done
            CHANGED="$CHANGED]"
          fi

          echo "changed_libraries=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed libraries: $CHANGED"

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        library: ${{ fromJson(needs.detect-changes.outputs.changed_libraries) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve library directory
        id: lib
        run: |
          if [ -d "src/Common/${{ matrix.library }}" ]; then
            echo "dir=src/Common/${{ matrix.library }}" >> "$GITHUB_OUTPUT"
          elif [ -d "src/Core/${{ matrix.library }}" ]; then
            echo "dir=src/Core/${{ matrix.library }}" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: cannot find directory for ${{ matrix.library }}"; exit 1
          fi

      # Version is derived at build time by the root Directory.Build.props —
      # 2.<run_number>.<run_attempt> in CI. Restore is scoped to the library
      # (transitively pulls its ProjectReferences) so library publishing isn't
      # coupled to unrelated packages.
      - name: Pack
        run: |
          dotnet restore "${{ steps.lib.outputs.dir }}/"
          dotnet pack "${{ steps.lib.outputs.dir }}/" --configuration Release --no-restore -o ./nupkg

      - name: Publish to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
