name: NuGet Publish — Auto Version & Release

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Common/**'
      - 'src/Core/**'

  workflow_dispatch:
    inputs:
      force_publish_all:
        description: 'Force publish all packages'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_libraries: ${{ steps.detect.outputs.changed_libraries }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed libraries
        id: detect
        run: |
          ALL_LIBS='["Sorcha.Register.Models","Sorcha.Tenant.Models","Sorcha.Blueprint.Models","Sorcha.Storage.Abstractions","Sorcha.Cryptography","Sorcha.Blueprint.Schemas","Sorcha.Blueprint.Schemas.Client","Sorcha.Storage.InMemory","Sorcha.Storage.EFCore","Sorcha.Storage.MongoDB","Sorcha.Storage.Redis","Sorcha.TransactionHandler","Sorcha.Validator.Core","Sorcha.Wallet.Core","Sorcha.Wallet.Portable","Sorcha.ServiceClients","Sorcha.ServiceClients.Http","Sorcha.ServiceDefaults","Sorcha.Blueprint.Engine","Sorcha.Blueprint.Fluent","Sorcha.Register.Core","Sorcha.Register.Storage","Sorcha.Register.Storage.InMemory","Sorcha.Register.Storage.MongoDB","Sorcha.Register.Storage.Redis"]'

          if [ "${{ github.event.inputs.force_publish_all }}" == "true" ]; then
            echo "Force publishing all libraries"
            CHANGED="$ALL_LIBS"
          else
            # Compare each library against its last version-bump commit.
            # This catches accumulated drift — not just the latest commit.
            CHANGED="["
            FIRST=true
            for dir in src/Common/*/ src/Core/*/; do
              [ ! -d "$dir" ] && continue
              LIB=$(basename "$dir")
              CSPROJ="$dir$LIB.csproj"
              [ ! -f "$CSPROJ" ] && continue

              # Find the commit that last bumped the version (CI version commits)
              LAST_BUMP=$(git log --oneline --all -1 --grep="chore: bump $LIB to" --format="%H" 2>/dev/null || true)

              if [ -z "$LAST_BUMP" ]; then
                # No version-bump commit found — library was never published via CI
                HAS_CHANGES=true
              else
                # Check if any source files changed since the last version bump
                if git diff --name-only "$LAST_BUMP" HEAD -- "$dir" | grep -qv '\.csproj$'; then
                  HAS_CHANGES=true
                else
                  HAS_CHANGES=false
                fi
              fi

              if [ "$HAS_CHANGES" = true ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  CHANGED="$CHANGED,"
                fi
                CHANGED="$CHANGED\"$LIB\""
              fi
            done
            CHANGED="$CHANGED]"
          fi

          echo "changed_libraries=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed libraries: $CHANGED"

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        library: ${{ fromJson(needs.detect-changes.outputs.changed_libraries) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bump minor version
        id: version
        run: |
          if [ -f "src/Common/${{ matrix.library }}/${{ matrix.library }}.csproj" ]; then
            CSPROJ="src/Common/${{ matrix.library }}/${{ matrix.library }}.csproj"
          elif [ -f "src/Core/${{ matrix.library }}/${{ matrix.library }}.csproj" ]; then
            CSPROJ="src/Core/${{ matrix.library }}/${{ matrix.library }}.csproj"
          else
            echo "ERROR: Cannot find csproj for ${{ matrix.library }}"
            exit 1
          fi
          echo "csproj_path=$CSPROJ" >> "$GITHUB_OUTPUT"
          LIB_DIR=$(dirname "$CSPROJ")
          echo "lib_dir=$LIB_DIR" >> "$GITHUB_OUTPUT"
          CURRENT=$(grep -oP '<Version>\K[^<]+' "$CSPROJ")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$NEW_MINOR.0"

          sed -i "s|<Version>$CURRENT</Version>|<Version>$NEW_VERSION</Version>|" "$CSPROJ"

          echo "old_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped ${{ matrix.library }} from $CURRENT to $NEW_VERSION"

      - name: Restore and Build
        # Restore only the library being published (transitively pulls its
        # ProjectReferences). A blanket `dotnet restore` would pull the whole
        # solution — including Sorcha.Cli's unrelated packages — which is both
        # wasteful and couples library publishing to dependencies the libs don't
        # use (e.g. a revoked upstream signing cert on a CLI-only package).
        run: |
          dotnet restore ${{ steps.version.outputs.lib_dir }}/
          dotnet build ${{ steps.version.outputs.lib_dir }}/ --configuration Release --no-restore

      - name: Pack
        run: dotnet pack ${{ steps.version.outputs.lib_dir }}/ --configuration Release --no-build -o ./nupkg

      - name: Publish to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.version.outputs.csproj_path }}"
          git commit -m "chore: bump ${{ matrix.library }} to ${{ steps.version.outputs.new_version }}" || true
          git push || true
