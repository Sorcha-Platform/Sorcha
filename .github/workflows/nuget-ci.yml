name: NuGet CI — Build & Test

# No `paths:` filter on the trigger. `build-and-test` is a REQUIRED status
# check on master, and GitHub leaves a required check stuck in "Expected" (which
# blocks the merge) whenever a path filter skips the whole workflow — e.g. a
# docs-only PR. So the workflow always runs; the `changes` guard step below
# decides whether the expensive build+test actually executes. Docs-only PRs get
# an instant green `build-and-test` instead of a perpetually-pending one.
on:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      # Detect whether anything that affects the build/tests changed. When it
      # hasn't (docs/workflow-of-other-kinds-only PR), every step below is
      # skipped and the job still reports success, satisfying the required check.
      - name: Detect code changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '*.sln'
              - 'Directory.Packages.props'
              - '.github/workflows/nuget-ci.yml'

      - name: No code changes — build/test skipped
        if: steps.changes.outputs.code != 'true'
        run: echo "No src/tests/sln/packages changes — skipping build+test; required check passes."

      - name: Setup .NET
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Central Package Management without lockfiles, so key on the version
      # manifest + every csproj. restore-keys lets a partial cache seed a cold
      # restore instead of starting from empty.
      - name: Cache NuGet packages
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        if: steps.changes.outputs.code == 'true'
        run: dotnet restore

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit + in-memory integration)
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          # Bypass `dotnet test` and invoke each test exe directly via its xunit.v3
          # Microsoft.Testing.Platform entry point. `dotnet test --no-build` was
          # non-deterministically dispatching VSTest target on a subset of projects
          # whose binaries are MTP-native, producing
          #   "The argument …Tests.dll is invalid"
          # at host startup. Direct invocation sidesteps the MSBuild target heuristic.
          #
          # Infrastructure-dependent test projects require Docker, databases, or
          # browsers not available on the CI runner — skipped here, run locally or
          # in a dedicated integration test workflow.
          INFRA=(
            "Sorcha.UI.E2E.Tests"
            "Sorcha.Gateway.Integration.Tests"
            "Sorcha.Validator.Service.IntegrationTests"
            "Sorcha.Tenant.Service.IntegrationTests"
            "Sorcha.Wallet.Service.IntegrationTests"
            "Sorcha.Blueprint.Service.IntegrationTests"
            "Sorcha.Register.Service.IntegrationTests"
            "Sorcha.Register.Storage.MongoDB.Tests"
            "Sorcha.Peer.Service.Integration.Tests"
          )

          # Projects with known pre-existing test failures (tracked as separate
          # cleanup issues). They run, emit TRX, and surface their failures in
          # logs — but their non-zero exit does NOT gate this workflow until
          # the underlying issues are resolved. Remove from this list as each
          # project is cleaned up so regressions are caught from then on.
          KNOWN_BROKEN=(
            "Sorcha.TransactionHandler.Tests"     # 1 Linux-only flake — issue #453
          )

          # Test projects still on xunit v2 — direct dll invocation expects
          # xunit.v3's Microsoft.Testing.Platform CLI flags, which v2 doesn't
          # recognise (fails with FormatException on --report-xunit-trx-*).
          # Skip until migrated to xunit.v3.
          XUNIT_V2_PENDING_MIGRATION=(
            "Sorcha.Performance.Tests"
            "Sorcha.Wallet.Providers.Azure.Tests"
          )

          is_in() {
            local n=$1; shift
            for i in "$@"; do [[ "$i" == "$n" ]] && return 0; done
            return 1
          }

          EXIT_CODE=0
          shopt -s globstar nullglob
          for proj in tests/*/*.csproj; do
            name=$(basename "$proj" .csproj)
            if is_in "$name" "${INFRA[@]}"; then
              echo "⏭️  Skipping $name (requires infrastructure)"
              continue
            fi
            if is_in "$name" "${XUNIT_V2_PENDING_MIGRATION[@]}"; then
              echo "⏭️  Skipping $name (xunit v2 — pending migration to v3)"
              continue
            fi
            dll="tests/$name/bin/Release/net10.0/$name.dll"
            if [[ ! -f "$dll" ]]; then
              echo "⚠️  $name — no built dll at $dll, skipping"
              continue
            fi
            # Skip library projects under tests/ that aren't runnable executables
            # (e.g. Sorcha.Testing — shared test-helper library, no runtimeconfig).
            if [[ ! -f "tests/$name/bin/Release/net10.0/$name.runtimeconfig.json" ]]; then
              echo "📚 $name — library project (no runtimeconfig), skipping"
              continue
            fi
            echo "🧪 Testing $name..."
            # xunit.v3 MTP-native flags. TRX lands next to the dll under TestResults/.
            if is_in "$name" "${KNOWN_BROKEN[@]}"; then
              dotnet "$dll" \
                --report-xunit-trx --report-xunit-trx-filename test-results.trx \
                || echo "⚠️  $name has known failures (tolerated — see cleanup issue)"
            else
              dotnet "$dll" \
                --report-xunit-trx --report-xunit-trx-filename test-results.trx \
                || EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE

      - name: PWA bundle hygiene check (Feature 122)
        if: steps.changes.outputs.code == 'true'
        shell: pwsh
        run: pwsh scripts/check-pwa-bundle.ps1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.code == 'true'
        with:
          name: test-results
          path: '**/test-results.trx'
          retention-days: 7
