name: Docker Publish — Build & Push Images

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Services/**'
      - 'src/Apps/**'
      - 'src/Common/**'
      - 'src/Core/**'
      - 'docker-compose.yml'
      - 'Directory.Packages.props'

  workflow_dispatch:
    inputs:
      force_publish_all:
        description: 'Force publish all service images'
        required: false
        type: boolean
        default: false

# Serialize master pushes — never overlap a publish run with itself.
# Don't cancel-in-progress on master: a tag push mid-build should still finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          ALL_SERVICES='["blueprint-service","wallet-service","register-service","tenant-service","peer-service","validator-service","api-gateway","mcp-server","ui-web","haip-service","wallet-pwa","verifier"]'

          if [ "${{ github.event.inputs.force_publish_all }}" == "true" ]; then
            echo "Force publishing all services"
            echo "services=$ALL_SERVICES" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if Common or Core libraries changed — triggers all services
          COMMON_CORE_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E "^src/(Common|Core)/" | head -1 || true)
          DOCKER_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E "^(docker-compose\.yml|Directory\.Packages\.props)" | head -1 || true)

          if [ -n "$COMMON_CORE_CHANGED" ] || [ -n "$DOCKER_CHANGED" ]; then
            echo "Common/Core/infrastructure changed — rebuilding all services"
            echo "services=$ALL_SERVICES" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check individual services and apps
          declare -A SERVICE_PATHS
          SERVICE_PATHS["blueprint-service"]="src/Services/Sorcha.Blueprint.Service/"
          SERVICE_PATHS["wallet-service"]="src/Services/Sorcha.Wallet.Service/"
          SERVICE_PATHS["register-service"]="src/Services/Sorcha.Register.Service/"
          SERVICE_PATHS["tenant-service"]="src/Services/Sorcha.Tenant.Service/"
          SERVICE_PATHS["peer-service"]="src/Services/Sorcha.Peer.Service/"
          SERVICE_PATHS["validator-service"]="src/Services/Sorcha.Validator.Service/"
          SERVICE_PATHS["api-gateway"]="src/Services/Sorcha.ApiGateway/"
          SERVICE_PATHS["mcp-server"]="src/Apps/Sorcha.McpServer/"
          SERVICE_PATHS["ui-web"]="src/Apps/Sorcha.UI/"
          SERVICE_PATHS["haip-service"]="src/Services/Sorcha.Haip.Service/"
          SERVICE_PATHS["wallet-pwa"]="src/Apps/Sorcha.Wallet.Pwa/"
          SERVICE_PATHS["verifier"]="src/Apps/Sorcha.Verifier/"

          CHANGED="["
          FIRST=true
          for SVC in "${!SERVICE_PATHS[@]}"; do
            if git diff --name-only HEAD~1 HEAD | grep -q "${SERVICE_PATHS[$SVC]}"; then
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                CHANGED="$CHANGED,"
              fi
              CHANGED="$CHANGED\"$SVC\""
            fi
          done
          CHANGED="$CHANGED]"

          echo "services=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed services: $CHANGED"

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Dockerfile path
        id: resolve
        run: |
          declare -A DOCKERFILES
          DOCKERFILES["blueprint-service"]="src/Services/Sorcha.Blueprint.Service/Dockerfile"
          DOCKERFILES["wallet-service"]="src/Services/Sorcha.Wallet.Service/Dockerfile"
          DOCKERFILES["register-service"]="src/Services/Sorcha.Register.Service/Dockerfile"
          DOCKERFILES["tenant-service"]="src/Services/Sorcha.Tenant.Service/Dockerfile"
          DOCKERFILES["peer-service"]="src/Services/Sorcha.Peer.Service/Dockerfile"
          DOCKERFILES["validator-service"]="src/Services/Sorcha.Validator.Service/Dockerfile"
          DOCKERFILES["api-gateway"]="src/Services/Sorcha.ApiGateway/Dockerfile"
          DOCKERFILES["mcp-server"]="src/Apps/Sorcha.McpServer/Dockerfile"
          DOCKERFILES["ui-web"]="src/Apps/Sorcha.UI/Sorcha.UI.Web/Dockerfile"
          DOCKERFILES["haip-service"]="src/Services/Sorcha.Haip.Service/Dockerfile"
          DOCKERFILES["wallet-pwa"]="src/Apps/Sorcha.Wallet.Pwa/Dockerfile"
          DOCKERFILES["verifier"]="src/Apps/Sorcha.Verifier/Dockerfile"
          echo "dockerfile=${DOCKERFILES[${{ matrix.service }}]}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.resolve.outputs.dockerfile }}
          push: true
          platforms: linux/amd64
          # Pass the run identifiers into the build so the published assembly's
          # version matches the :2.<run>.<attempt> image tag below (the root
          # Directory.Build.props derives the version from these env vars).
          # Dockerfiles that don't declare the matching ARG simply ignore these.
          build-args: |
            GITHUB_RUN_NUMBER=${{ github.run_number }}
            GITHUB_RUN_ATTEMPT=${{ github.run_attempt }}
          # Unified version scheme: 2.<run_number>.<run_attempt> (matches the
          # .NET assembly version derived in the root Directory.Build.props).
          tags: |
            sorchadev/${{ matrix.service }}:latest
            sorchadev/${{ matrix.service }}:master
            sorchadev/${{ matrix.service }}:master-${{ github.sha }}
            sorchadev/${{ matrix.service }}:2.${{ github.run_number }}.${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
