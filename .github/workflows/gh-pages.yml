name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/site/**'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/index.html'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/*.html'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/.well-known/apple-app-site-association'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/.well-known/assetlinks.json'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/landing.css'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/landing.js'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/consent-banner.js'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/og-*.png'
      - 'scripts/copy-landing-to-site.js'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy landing page from Sorcha.UI
        run: node scripts/copy-landing-to-site.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # NOTE: actions/upload-pages-artifact hardcodes `--exclude=".[^/]*"` in its tar,
      # which strips every top-level dot-folder — including .well-known (the AASA /
      # assetlinks.json that native iOS/Android passkeys require). Its `include-hidden-files`
      # input does not exist, so it silently no-ops. Archive the artifact ourselves with a
      # plain `tar .` so dotfiles are included, then upload it as the github-pages artifact.
      - name: Archive Pages artifact (include .well-known)
        shell: bash
        run: |
          tar --dereference --hard-dereference \
            --directory docs/site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github \
            .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: "1"
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
