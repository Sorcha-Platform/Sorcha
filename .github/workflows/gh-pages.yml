name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/site/**'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/index.html'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/*.html'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/.well-known/apple-app-site-association'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/.well-known/assetlinks.json'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/landing.css'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/landing.js'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/consent-banner.js'
      - 'src/Apps/Sorcha.UI/Sorcha.UI.Web/wwwroot/og-*.png'
      - 'scripts/copy-landing-to-site.js'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy landing page from Sorcha.UI
        run: node scripts/copy-landing-to-site.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
