#
# MCP tool route-contract CI gate. Fails when a registered MCP tool — or a typed service-client
# method one of them calls — issues a request path whose route family no Sorcha service maps.
#
# The public MCP server advertises ~65 tools to external AI agents. An audit found TEN calling
# routes that were never mapped, including the ENTIRE participant discovery loop, so an agent
# could submit an action but never discover or inspect one. Nothing fails at build time: the tool
# compiles, the client compiles, and the 404 reaches the agent as a generic "failed to retrieve",
# which reads as a transient outage rather than a permanently broken tool.
#
# Only classes carrying [McpServerToolType] are in scope — a tool deliberately left off the served
# surface (WalletSignTool, spec 139 T029) must not fail the gate for a route nobody can call.
#
# See scripts/check-mcp-routes.ps1 and .mcp-routes-allowlist (a ratchet: may only shrink).
#
# This workflow carries BOTH halves of the MCP tool<->service seam: the route gate (is the URL
# mapped?) and the response-shape gate (does the tool read what that endpoint sends?). They are
# siblings because they share a trigger set exactly — any change to a tool, a typed client, or a
# service endpoint can break either one.

name: mcp-routes-gate

on:
  pull_request:
    paths:
      - "src/Apps/Sorcha.McpServer/**/*.cs"
      - "src/Common/Sorcha.ServiceClients/**/*.cs"
      - "src/Common/Sorcha.ServiceClients.Http/**/*.cs"
      - "src/Services/**/*.cs"
      - "scripts/check-mcp-routes.ps1"
      - ".mcp-routes-allowlist"
      - "scripts/check-mcp-response-shapes.ps1"
      - ".mcp-response-shapes-allowlist"
      - ".github/workflows/mcp-routes-gate.yml"
  workflow_dispatch:

jobs:
  mcp-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run MCP route contract gate
        shell: pwsh
        run: ./scripts/check-mcp-routes.ps1

  # The route gate above proves the URL is mapped. It says NOTHING about whether the tool reads what
  # that endpoint sends — which is how sorcha_tenant_list reported "Retrieved 0 tenant(s)" next to
  # "totalCount": 27 with the route gate green, and how nine of the ten tools repointed in P0 were
  # ALSO wrong about response shape once their URLs were right. This job closes that half of the
  # seam, and it walks NESTED element types as well as the envelope: the tenant defect was present
  # at both levels, and the element-level half survived the envelope fix.
  mcp-response-shapes-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run MCP response shape contract gate
        shell: pwsh
        run: ./scripts/check-mcp-response-shapes.ps1
