name: CLI Publish — Pack & Push .NET Global Tool

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Apps/Sorcha.Cli/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Version is derived at build time by the unified scheme in the root
      # Directory.Build.props — 2.<run_number>.<run_attempt> in CI. No version
      # bump or commit needed; GITHUB_RUN_NUMBER/GITHUB_RUN_ATTEMPT are set by
      # the runner and flow into the package version automatically.
      - name: Pack
        run: dotnet pack src/Apps/Sorcha.Cli/ --configuration Release -o ./nupkg

      - name: Publish to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
